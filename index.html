<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>請假加班系統 — 台灣物理學會行政室</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0D14; --bg2:#0F141F; --card:#151C2B; --card2:#1C2436;
  --gold:#D9A93C; --gold-b:#F5D583; --line:rgba(217,169,60,.18);
  --txt:#EAEDF4; --dim:#8D96AC; --dim2:#5C6478;
  --ok:#4FBE81; --warn:#E5A83F; --bad:#E0605A;
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Noto Sans TC',system-ui,sans-serif;
  --halo:0 0 0 1px var(--line), 0 0 30px rgba(217,169,60,.10);
  --halo-hi:0 0 0 1px rgba(217,169,60,.5), 0 0 40px rgba(217,169,60,.25);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--txt);font-size:15px;line-height:1.6;min-height:100dvh;
  background:radial-gradient(800px 460px at 50% -8%,rgba(217,169,60,.11),transparent 62%),
             linear-gradient(180deg,var(--bg2),var(--bg));background-attachment:fixed;
  padding-bottom:env(safe-area-inset-bottom)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.3;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px)}
body>*{position:relative;z-index:2}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-weight:700;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hide{display:none!important}

.wrap{max-width:560px;margin:0 auto;padding:18px 16px calc(120px + env(safe-area-inset-bottom))}
.gate{min-height:100dvh;display:grid;place-items:center;padding:22px}
.card{background:var(--card);border-radius:14px;box-shadow:var(--halo);margin-bottom:14px}
.card.glow{box-shadow:var(--halo-hi)}
.chd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.chd h2{font-size:14.5px;letter-spacing:.03em}
.unit{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--dim2)}
.cbd{padding:18px}

.brand{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--gold);margin-bottom:9px}
.sub{color:var(--dim);font-size:13px}

.field{margin-bottom:15px}
label.lb{display:block;font-size:12.5px;color:var(--dim);margin-bottom:6px}
.hint{font-size:12px;color:var(--dim2);margin-top:6px;line-height:1.5}
input,select,textarea{width:100%;padding:11px 13px;background:var(--bg);color:var(--txt);
  border:1px solid rgba(255,255,255,.09);border-radius:9px;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(217,169,60,.14)}
::placeholder{color:var(--dim2)}
textarea{min-height:70px;resize:vertical;font-size:15px}
input[type=date],input[type=time],input[type=number]{font-family:var(--mono)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{background:linear-gradient(145deg,var(--gold-b),var(--gold));color:#1C1305;border:none;
  border-radius:10px;padding:13px 22px;font-weight:700;cursor:pointer;font-size:15px;
  box-shadow:0 0 24px rgba(217,169,60,.28)}
.btn:active{transform:scale(.985)}
.btn:disabled{background:#2B3243;color:var(--dim2);box-shadow:none}
.btn.wide{width:100%}
.btn.sm{padding:8px 15px;font-size:13px;border-radius:8px}
.btn.ghost{background:none;color:var(--dim);box-shadow:0 0 0 1px rgba(255,255,255,.13)}
.btn.ghost:active{color:var(--gold)}
.btn.ok{background:linear-gradient(145deg,#6ED09A,var(--ok));color:#06210F;box-shadow:0 0 18px rgba(79,190,129,.3)}
.btn.no{background:none;color:var(--bad);box-shadow:0 0 0 1px rgba(224,96,90,.45)}

.err{background:rgba(224,96,90,.09);color:#F5928C;padding:11px 14px;border-radius:9px;
  font-size:13.5px;margin-bottom:15px;box-shadow:0 0 0 1px rgba(224,96,90,.3)}
.info{background:rgba(217,169,60,.07);color:var(--gold-b);padding:11px 14px;border-radius:9px;
  font-size:13px;margin-bottom:15px;box-shadow:0 0 0 1px var(--line)}
.empty{padding:38px 18px;text-align:center;color:var(--dim2);font-size:13.5px}

.tag{font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.tag.pending{background:rgba(229,168,63,.15);color:var(--warn)}
.tag.approved{background:rgba(79,190,129,.15);color:var(--ok)}
.tag.rejected{background:rgba(224,96,90,.15);color:var(--bad)}
.tag.cancelled{background:rgba(141,150,172,.13);color:var(--dim)}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:var(--card2);
  color:var(--txt);padding:12px 22px;border-radius:10px;font-size:14px;opacity:0;transition:.26s;
  z-index:99;box-shadow:var(--halo-hi);max-width:88vw;text-align:center}
.toast.is-in{opacity:1;transform:translate(-50%,0)}
.toast--error{color:#F5928C}
.toast--success{color:var(--ok)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}


/* --- 前台專屬 --- */
.hero{display:flex;align-items:center;gap:12px;padding:16px 18px}
.ava{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;
  background:linear-gradient(145deg,var(--gold),#9E7820);color:#1C1305;box-shadow:0 0 16px rgba(217,169,60,.4)}
.hero .nm{font-weight:700;font-size:16px}
.hero .rl{font-size:12px;color:var(--dim)}
.hero .out{margin-left:auto}

.bal{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px 18px}
.bcell{background:var(--bg);border-radius:11px;padding:13px 14px;box-shadow:0 0 0 1px rgba(255,255,255,.05)}
.bcell .k{font-size:11.5px;color:var(--dim);letter-spacing:.05em}
.bcell .v{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--gold-b);
  text-shadow:0 0 16px rgba(217,169,60,.45);line-height:1.45;margin-top:2px;
  overflow:visible;white-space:nowrap}
.bcell .v small{font-size:11px;color:var(--dim2);font-weight:400;margin-left:3px;text-shadow:none}
.bar{height:5px;background:rgba(255,255,255,.07);border-radius:3px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-b));
  box-shadow:0 0 10px rgba(217,169,60,.6);transition:width .4s}

.acts2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.big{background:var(--card);border:none;border-radius:14px;padding:22px 12px;cursor:pointer;
  box-shadow:var(--halo);display:flex;flex-direction:column;align-items:center;gap:7px;transition:box-shadow .25s}
.big:active{transform:scale(.985)}
.big .ic{font-size:28px;line-height:1}
.big .t{font-size:15.5px;font-weight:700;color:var(--txt)}
.big .d{font-size:11.5px;color:var(--dim)}
.big[aria-selected="true"]{box-shadow:var(--halo-hi)}
.big[aria-selected="true"] .t{color:var(--gold-b)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1px solid rgba(255,255,255,.09);border-radius:20px;
  padding:9px 15px;cursor:pointer;font-size:14px;color:var(--dim)}
.chip[aria-pressed="true"]{color:var(--gold-b);border-color:transparent;background:rgba(217,169,60,.1);
  box-shadow:0 0 0 1px rgba(217,169,60,.55),0 0 16px rgba(217,169,60,.2)}
.calc{background:var(--bg);border-radius:11px;padding:15px 16px;margin-bottom:15px;
  box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.calc .lab{font-size:12.5px;color:var(--dim)}
.calc .big2{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--gold-b);
  text-shadow:0 0 16px rgba(217,169,60,.4);line-height:1.3;white-space:nowrap}
.calc .after{margin-left:auto;text-align:right;font-size:12.5px;color:var(--dim);
  line-height:1.6;max-width:58%;min-width:0}
.calc .after b{font-family:var(--mono);color:var(--txt)}
.switch{display:flex;align-items:center;gap:10px;font-size:14.5px;cursor:pointer;padding:4px 0}
.switch input{width:19px;height:19px;accent-color:var(--gold);flex:none}

.rec{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.05)}
.rec:last-child{border-bottom:none}
.rtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.rtype{font-weight:700;font-size:14.5px}
.rh{margin-left:auto;font-family:var(--mono);font-weight:700;color:var(--gold-b);font-size:14px}
.rw{font-family:var(--mono);font-size:12px;color:var(--dim)}
.rn{font-size:12.5px;color:var(--dim);margin-top:4px}

</style>
</head>
<body>

<!-- 登入：一個畫面 -->
<section id="gate" class="gate">
  <div style="width:100%;max-width:380px">
    <div class="card"><div class="cbd" style="padding:32px 26px">
      <div class="brand">TPS · 行政室</div>
      <h1 style="font-size:21px">請假加班系統</h1>
      <p class="sub" style="margin:6px 0 22px">輸入 ID 和密碼。第一次使用會直接幫你綁定這組。</p>
      <div id="gErr" class="err hide"></div>
      <div class="field">
        <label class="lb" for="gid">ID</label>
        <input type="text" id="gid" autocapitalize="off" autocomplete="username" placeholder="英文或數字">
      </div>
      <div class="field">
        <label class="lb" for="gpw">密碼</label>
        <input type="password" id="gpw" autocomplete="current-password">
      </div>
      <button class="btn wide" id="gBtn">進入</button>
    </div></div>
  </div>
</section>

<!-- 第一次：填中文姓名 -->
<section id="nameGate" class="gate hide">
  <div style="width:100%;max-width:380px">
    <div class="card"><div class="cbd" style="padding:32px 26px">
      <div class="brand">TPS · 行政室</div>
      <h1 style="font-size:20px">歡迎，先填一下姓名</h1>
      <p class="sub" style="margin:6px 0 22px">秘書長的後台會看到這個名字，請填中文全名。</p>
      <div id="nErr" class="err hide"></div>
      <div class="field"><input type="text" id="nInp" placeholder="例如 楊綺萍"></div>
      <button class="btn wide" id="nBtn">開始使用</button>
      <button class="btn ghost wide" id="nOut" style="margin-top:10px">登出</button>
    </div></div>
  </div>
</section>

<!-- 主畫面 -->
<div id="app" class="hide"><div class="wrap">

  <div class="card">
    <div class="hero">
      <div class="ava" id="ava"></div>
      <div><div class="nm" id="nm"></div><div class="rl" id="rl"></div></div>
      <button class="btn ghost sm out" id="outBtn">登出</button>
    </div>
    <div class="bal">
      <div class="bcell">
        <div class="k">特別休假</div>
        <div class="v num"><span id="annV">0</span><small>小時</small></div>
        <div class="bar"><i id="annB" style="width:0"></i></div>
      </div>
      <div class="bcell">
        <div class="k">加班補休</div>
        <div class="v num"><span id="cmpV">0</span><small>小時</small></div>
        <div class="bar"><i id="cmpB" style="width:0"></i></div>
      </div>
    </div>
  </div>

  <div class="acts2">
    <button class="big" id="bLeave" aria-selected="true">
      <span class="ic">🌴</span><span class="t">我要請假</span><span class="d">特休・事病假・補休</span>
    </button>
    <button class="big" id="bOt" aria-selected="false">
      <span class="ic">⏰</span><span class="t">我要加班</span><span class="d">核准後轉補休</span>
    </button>
  </div>

  <!-- 請假 -->
  <section class="card" id="fLeave">
    <div class="chd"><h2>請假申請</h2><span class="unit">單位：小時</span></div>
    <div class="cbd">
      <div id="lErr" class="err hide"></div>
      <div class="field">
        <label class="lb">假別</label>
        <div class="chips" id="chips"></div>
      </div>
      <div class="field hide" id="othW">
        <label class="lb" for="oth">假別名稱</label>
        <input type="text" id="oth" placeholder="例如 喪假">
      </div>
      <div class="field">
        <label class="lb">從</label>
        <div class="row"><input type="date" id="sd"><input type="time" id="st" value="09:00" step="1800"></div>
      </div>
      <div class="field">
        <label class="lb">到</label>
        <div class="row"><input type="date" id="ed"><input type="time" id="et" value="17:00" step="1800"></div>
      </div>

      <div class="calc">
        <div>
          <div class="lab">自動算出時數</div>
          <div class="big2 num"><span id="calcH">0</span></div>
        </div>
        <div class="after" id="calcAfter"></div>
      </div>
      <div class="field">
        <label class="lb" for="hrs">時數不對的話改這裡</label>
        <input type="number" id="hrs" min="0.5" step="0.5" placeholder="0">
        <div class="hint">以上班時間 09:00–17:00、中午 12:00–13:00 休息、只算平日來計算。</div>
      </div>

      <div class="field"><label class="switch"><input type="checkbox" id="late">這是事後補請假</label>
        <div id="lateW" class="hide" style="margin-top:9px"><textarea id="lateR" placeholder="說明原因"></textarea></div></div>
      <div class="field"><label class="switch"><input type="checkbox" id="prx">需要職務代理人</label>
        <div id="prxW" class="hide" style="margin-top:9px"><input type="text" id="prxN" placeholder="代理人姓名"></div></div>

      <button class="btn wide" id="subL">送出假單</button>
    </div>
  </section>

  <!-- 加班 -->
  <section class="card hide" id="fOt">
    <div class="chd"><h2>加班申請</h2><span class="unit">單位：小時</span></div>
    <div class="cbd">
      <div class="info">加班前要先在 LINE 群組通知秘書長並獲得同意。</div>
      <div id="oErr" class="err hide"></div>
      <div class="field"><label class="lb" for="od">日期</label><input type="date" id="od"></div>
      <div class="field"><label class="lb">時間</label>
        <div class="row"><input type="time" id="os" value="17:00" step="1800"><input type="time" id="oe" value="19:00" step="1800"></div></div>
      <div class="calc">
        <div><div class="lab">自動算出時數</div><div class="big2 num"><span id="ocalcH">0</span></div></div>
        <div class="after" id="ocalcAfter"></div>
      </div>
      <div class="field">
        <label class="lb" for="ohrs">時數不對的話改這裡</label>
        <input type="number" id="ohrs" min="0.5" step="0.5" placeholder="0">
        <div class="hint">單月加班上限 46 小時，超過會標記提醒秘書長。</div>
      </div>
      <div class="field"><label class="lb" for="orsn">加班事由</label><textarea id="orsn" placeholder="處理什麼工作"></textarea></div>
      <button class="btn wide" id="subO">送出加班單</button>
    </div>
  </section>

  <section class="card">
    <div class="chd"><h2>我的申請</h2><span class="unit">近 50 筆</span></div>
    <div id="recs"><div class="empty">還沒有紀錄。</div></div>
  </section>

</div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="shared.js?v=2.2.0"></script>
<script>

var T = window.TPS;
var el = T.el, esc = T.esc, toast = T.toast, roundHalf = T.roundHalf;
T.setErrorHandler(function(e){ toast('讀取失敗：' + (e.message || e.code || e), 'error'); });
var S = { tab:'leave', type:'annual', bal:{}, peak:{annual:1,comp:1}, unsub:[], busy:false, uid:null };

function showErr(id, msg){
  var b = el('#'+id);
  if(!msg){ b.classList.add('hide'); return; }
  b.textContent = msg; b.classList.remove('hide');
}
function screen(id){
  ['#gate','#nameGate','#app'].forEach(function(s){ el(s).classList.toggle('hide', s!==id); });
}

/* ---------- 登入：一顆按鈕 ---------- */
el('#gBtn').onclick = function(){
  if(S.busy) return;
  showErr('gErr','');
  var id = el('#gid').value, pw = el('#gpw').value;
  if(!id.trim() || !pw) return showErr('gErr','ID 和密碼都要填。');
  var b = el('#gBtn'); S.busy = true; b.disabled = true; b.textContent = '處理中…';
  T.loginOrRegister(id, pw).then(function(r){
    if(r.isNew) toast('已綁定這組 ID','success');
  }).catch(function(e){
    showErr('gErr', e.message || '登入失敗，請再試一次。');
  }).then(function(){
    S.busy = false; b.disabled = false; b.textContent = '進入';
  });
};
['#gid','#gpw'].forEach(function(i){
  el(i).addEventListener('keydown', function(e){ if(e.key==='Enter') el('#gBtn').click(); });
});

/* ---------- 第一次填姓名 ---------- */
el('#nBtn').onclick = function(){
  showErr('nErr','');
  var b = el('#nBtn'); b.disabled = true;
  T.setDisplayName(el('#nInp').value).then(function(){
    var u = T.currentUser(); u.needsName = false; start(u);
  }).catch(function(e){ showErr('nErr', e.message); })
    .then(function(){ b.disabled = false; });
};
el('#nInp').addEventListener('keydown', function(e){ if(e.key==='Enter') el('#nBtn').click(); });
el('#nOut').onclick = function(){ T.signOut(); };
el('#outBtn').onclick = function(){ T.signOut(); };

/* ---------- 狀態 ---------- */
T.watchAuth(function(user){
  S.unsub.forEach(function(f){ f(); }); S.unsub = [];
  if(!user){ screen('#gate'); el('#gpw').value=''; return; }
  if(user.active === false){ toast('這個帳號已被停用','error'); T.signOut(); return; }
  if(user.needsName){ screen('#nameGate'); el('#nInp').focus(); return; }
  start(user);
});

function start(user){
  screen('#app');
  S.uid = user.uid;
  el('#nm').textContent = user.name;
  el('#rl').textContent = T.ROLE_LABEL[user.role] + '　ID：' + user.loginId;
  el('#ava').textContent = user.name.slice(-2, -1) || user.name.slice(0,1);
  if(!T.canApply()){
    el('#fLeave').classList.add('hide'); el('#fOt').classList.add('hide');
    document.querySelector('.acts2').classList.add('hide');
  }
  S.unsub.push(T.watchBalance(user.uid, function(b){
    S.bal = b || {};
    S.peak.annual = Math.max(S.peak.annual, S.bal.annualRemaining||0, 1);
    S.peak.comp   = Math.max(S.peak.comp,   S.bal.compRemaining||0, 1);
    paintBal();
  }));
  S.unsub.push(T.watchMyLeaves(renderRecs));
  T.getBalance(user.uid).then(function(b){
    S.peak.annual = Math.max(b.annualRemaining||0, 1);
    S.peak.comp   = Math.max(b.compRemaining||0, 1);
    S.bal = b; paintBal();
  });
}

function paintBal(){
  var a = S.bal.annualRemaining||0, c = S.bal.compRemaining||0;
  el('#annV').textContent = a; el('#cmpV').textContent = c;
  el('#annB').style.width = Math.min(100, a/S.peak.annual*100) + '%';
  el('#cmpB').style.width = Math.min(100, c/S.peak.comp*100) + '%';
  paintCalc();
}

/* ---------- 假別 ---------- */
var chips = el('#chips');
T.LEAVE_TYPES.forEach(function(t){
  var b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.textContent = t.label;
  b.setAttribute('aria-pressed', t.id === S.type);
  b.onclick = function(){
    S.type = t.id;
    Array.prototype.forEach.call(chips.children, function(c, i){
      c.setAttribute('aria-pressed', T.LEAVE_TYPES[i].id === S.type);
    });
    el('#othW').classList.toggle('hide', !t.needsText);
    paintCalc();
  };
  chips.appendChild(b);
});

/* ---------- 切換請假 / 加班 ---------- */
function setTab(t){
  S.tab = t;
  el('#bLeave').setAttribute('aria-selected', t==='leave');
  el('#bOt').setAttribute('aria-selected', t==='ot');
  el('#fLeave').classList.toggle('hide', t!=='leave');
  el('#fOt').classList.toggle('hide', t!=='ot');
}
el('#bLeave').onclick = function(){ setTab('leave'); };
el('#bOt').onclick = function(){ setTab('ot'); };

/* ---------- 自動算時數 ---------- */
var WIN = [[9,12],[13,17]];
function estimate(s, e){
  if(!(s < e)) return 0;
  var total = 0;
  var cur  = new Date(s.getFullYear(), s.getMonth(), s.getDate());
  var last = new Date(e.getFullYear(), e.getMonth(), e.getDate());
  while(cur <= last){
    var w = cur.getDay();
    if(w >= 1 && w <= 5){
      WIN.forEach(function(p){
        var ws = new Date(cur); ws.setHours(p[0],0,0,0);
        var we = new Date(cur); we.setHours(p[1],0,0,0);
        var from = Math.max(ws.getTime(), s.getTime());
        var to   = Math.min(we.getTime(), e.getTime());
        if(to > from) total += (to - from) / 36e5;
      });
    }
    cur.setDate(cur.getDate() + 1);
  }
  return roundHalf(total);
}
function dt(d, t){ return (d && t) ? new Date(d + 'T' + t) : null; }

function autoLeave(){
  var s = dt(el('#sd').value, el('#st').value), e = dt(el('#ed').value, el('#et').value);
  if(!s || !e || e <= s){ paintCalc(); return; }
  el('#hrs').value = estimate(s, e) || '';
  paintCalc();
}
function autoOt(){
  var d = el('#od').value;
  var s = dt(d, el('#os').value), e = dt(d, el('#oe').value);
  if(!s || !e || e <= s){ paintCalc(); return; }
  el('#ohrs').value = roundHalf((e - s) / 36e5);
  paintCalc();
}
function paintCalc(){
  var h = roundHalf(parseFloat(el('#hrs').value) || 0);
  el('#calcH').textContent = h;
  var def = null;
  T.LEAVE_TYPES.forEach(function(t){ if(t.id === S.type) def = t; });
  var box = el('#calcAfter');
  if(def && def.deducts && h > 0){
    var key   = def.deducts === 'annual' ? 'annualRemaining' : 'compRemaining';
    var label = def.deducts === 'annual' ? '特休' : '補休';
    var left  = roundHalf((S.bal[key] || 0) - h);
    box.innerHTML = left < 0
      ? '<span style="color:var(--bad)">' + label + '不夠，只剩 <b>' + (S.bal[key]||0) + '</b> 小時</span>'
      : '送出後' + label + '剩<br><b>' + left + '</b> 小時';
  } else box.innerHTML = def && def.deducts ? '' : '這個假別不扣時數';

  var oh = roundHalf(parseFloat(el('#ohrs').value) || 0);
  el('#ocalcH').textContent = oh;
  el('#ocalcAfter').innerHTML = oh > 0
    ? '核准後補休增加<br><b>+' + oh + '</b> 小時' : '';
}
['#st','#ed','#et'].forEach(function(i){ el(i).onchange = autoLeave; });
el('#sd').onchange = function(){
  if(!el('#ed').value || el('#ed').value < el('#sd').value) el('#ed').value = el('#sd').value;
  autoLeave();
};
['#od','#os','#oe'].forEach(function(i){ el(i).onchange = autoOt; });
el('#hrs').oninput = paintCalc;
el('#ohrs').oninput = paintCalc;
el('#late').onchange = function(e){ el('#lateW').classList.toggle('hide', !e.target.checked); };
el('#prx').onchange  = function(e){ el('#prxW').classList.toggle('hide', !e.target.checked); };

/* ---------- 送出 ---------- */
el('#subL').onclick = function(){
  if(S.busy) return;
  showErr('lErr','');
  var s = dt(el('#sd').value, el('#st').value), e = dt(el('#ed').value, el('#et').value);
  if(!s || !e) return showErr('lErr','請填請假的起訖日期時間。');
  var b = el('#subL'); S.busy = true; b.disabled = true; b.textContent = '送出中…';
  T.submitLeave({
    type:S.type, otherType:el('#oth').value, startAt:s, endAt:e,
    hours:parseFloat(el('#hrs').value),
    isLate:el('#late').checked, lateReason:el('#lateR').value,
    needsProxy:el('#prx').checked, proxyName:el('#prxN').value
  }).then(function(){
    toast('假單已送出，等秘書長審核','success');
    ['#hrs','#oth','#lateR','#prxN'].forEach(function(i){ el(i).value=''; });
    el('#late').checked = el('#prx').checked = false;
    el('#lateW').classList.add('hide'); el('#prxW').classList.add('hide');
    paintCalc();
  }).catch(function(err){ showErr('lErr', err.message); })
    .then(function(){ S.busy=false; b.disabled=false; b.textContent='送出假單'; });
};

el('#subO').onclick = function(){
  if(S.busy) return;
  showErr('oErr','');
  var d = el('#od').value;
  if(!d) return showErr('oErr','請選加班日期。');
  var b = el('#subO'); S.busy = true; b.disabled = true; b.textContent = '送出中…';
  T.submitOvertime({
    date:new Date(d+'T00:00:00'), startAt:dt(d, el('#os').value), endAt:dt(d, el('#oe').value),
    hours:parseFloat(el('#ohrs').value), reason:el('#orsn').value
  }).then(function(r){
    toast(r.overCapWarning ? '已送出，本月超過 46 小時已標記提醒' : '加班單已送出，等秘書長審核','success');
    el('#ohrs').value=''; el('#orsn').value=''; paintCalc();
  }).catch(function(err){ showErr('oErr', err.message); })
    .then(function(){ S.busy=false; b.disabled=false; b.textContent='送出加班單'; });
};

/* ---------- 我的申請 ---------- */
function renderRecs(list){
  var box = el('#recs');
  if(!list.length){ box.innerHTML = '<div class="empty">還沒有紀錄。</div>'; return; }
  box.innerHTML = '';
  list.forEach(function(r){
    var label = (r.type === 'other' && r.otherType) ? r.otherType : T.leaveTypeLabel(r.type);
    var d = document.createElement('div'); d.className = 'rec';
    var html = '<div class="rtop"><span class="rtype">' + esc(label) + '</span>' +
      '<span class="tag ' + r.status + '">' + T.STATUS_LABEL[r.status] + '</span>' +
      '<span class="rh">' + r.hours + ' 小時</span></div>' +
      '<div class="rw">' + T.fmtDateTime(r.startAt) + ' → ' + T.fmtDateTime(r.endAt) + '</div>';
    if(r.segments && r.segments.length > 1){
      html += '<div class="rn">跨月：' + r.segments.map(function(s){
        return s.ym + ' ' + s.hours + 'h'; }).join('、') + '</div>';
    }
    if(r.adminNote) html += '<div class="rn">秘書長註記：' + esc(r.adminNote) + '</div>';
    d.innerHTML = html;
    if(r.status === T.STATUS.PENDING){
      var c = document.createElement('button');
      c.className = 'btn ghost sm'; c.textContent = '撤銷'; c.style.marginTop = '10px';
      c.onclick = function(){
        if(!confirm('確定撤銷這張假單？')) return;
        T.cancelLeave(r.id).then(function(){ toast('已撤銷','success'); })
          .catch(function(e){ toast(e.message,'error'); });
      };
      d.appendChild(c);
    }
    box.appendChild(d);
  });
}

var today = new Date();
var iso = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
el('#sd').value = el('#ed').value = el('#od').value = iso;
autoLeave(); autoOt();

</script>
