<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>後台 — 請假加班系統</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0D14; --bg2:#0F141F; --card:#151C2B; --card2:#1C2436;
  --gold:#D9A93C; --gold-b:#F5D583; --line:rgba(217,169,60,.18);
  --txt:#EAEDF4; --dim:#8D96AC; --dim2:#5C6478;
  --ok:#4FBE81; --warn:#E5A83F; --bad:#E0605A;
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Noto Sans TC',system-ui,sans-serif;
  --halo:0 0 0 1px var(--line), 0 0 30px rgba(217,169,60,.10);
  --halo-hi:0 0 0 1px rgba(217,169,60,.5), 0 0 40px rgba(217,169,60,.25);
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
  --sl:env(safe-area-inset-left); --sr:env(safe-area-inset-right);
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{font-family:var(--sans);color:var(--txt);font-size:15px;line-height:1.6;
  min-height:100dvh;overscroll-behavior-y:none;
  background:radial-gradient(800px 460px at 50% -8%,rgba(217,169,60,.11),transparent 62%),
             linear-gradient(180deg,var(--bg2),var(--bg));background-attachment:fixed}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.3;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px)}
body>*{position:relative;z-index:2}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-weight:700;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hide{display:none!important}

input,select,textarea{width:100%;max-width:100%;font-size:16px;padding:12px 13px;
  background:var(--bg);color:var(--txt);border:1px solid rgba(255,255,255,.09);
  border-radius:10px;-webkit-appearance:none;appearance:none;background-clip:padding-box}
input[type=date],input[type=time]{min-height:48px;display:block;text-align:left;font-family:var(--mono)}
input[type=checkbox]{width:19px;min-height:0;-webkit-appearance:auto;appearance:auto;padding:0}
select{background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
  linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea{min-height:78px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;
  box-shadow:0 0 0 3px rgba(217,169,60,.14)}
::placeholder{color:var(--dim2)}

.card{background:var(--card);border-radius:14px;box-shadow:var(--halo);margin-bottom:14px}
.chd{padding:14px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.chd h2{font-size:14.5px;letter-spacing:.03em}
.unit{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  color:var(--dim2);white-space:nowrap;flex:none}
.cbd{padding:17px}
.field{margin-bottom:15px}
.field:last-child{margin-bottom:0}
label.lb{display:block;font-size:12.5px;color:var(--dim);margin-bottom:7px}
.hint{font-size:12px;color:var(--dim2);margin-top:7px;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{background:linear-gradient(145deg,var(--gold-b),var(--gold));color:#1C1305;border:none;
  border-radius:11px;padding:14px 22px;font-weight:700;cursor:pointer;font-size:15px;
  box-shadow:0 0 24px rgba(217,169,60,.26);width:100%}
.btn:active{transform:scale(.985)}
.btn:disabled{background:#2B3243;color:var(--dim2);box-shadow:none}
.btn.sm{padding:9px 15px;font-size:13.5px;border-radius:9px;width:auto}
.btn.ghost{background:none;color:var(--dim);box-shadow:0 0 0 1px rgba(255,255,255,.13)}
.btn.ghost:active{color:var(--gold)}
.btn.ok{background:linear-gradient(145deg,#6ED09A,var(--ok));color:#06210F;
  box-shadow:0 0 18px rgba(79,190,129,.28)}
.btn.no{background:none;color:var(--bad);box-shadow:0 0 0 1px rgba(224,96,90,.45)}

.err{background:rgba(224,96,90,.09);color:#F5928C;padding:12px 14px;border-radius:10px;
  font-size:13.5px;margin-bottom:15px;box-shadow:0 0 0 1px rgba(224,96,90,.3)}
.info{background:rgba(217,169,60,.07);color:var(--gold-b);padding:12px 14px;border-radius:10px;
  font-size:13px;line-height:1.7;margin-bottom:15px;box-shadow:0 0 0 1px var(--line)}
.empty{padding:40px 18px;text-align:center;color:var(--dim2);font-size:13.5px}
.tag{font-size:10.5px;padding:3px 10px;border-radius:20px;font-weight:700;
  letter-spacing:.04em;white-space:nowrap;flex:none}
.tag.pending{background:rgba(229,168,63,.15);color:var(--warn)}
.tag.approved{background:rgba(79,190,129,.15);color:var(--ok)}
.tag.rejected{background:rgba(224,96,90,.15);color:var(--bad)}
.tag.cancelled{background:rgba(141,150,172,.13);color:var(--dim)}

.toast{position:fixed;left:50%;bottom:calc(26px + var(--sb));transform:translate(-50%,16px);
  background:var(--card2);color:var(--txt);padding:13px 22px;border-radius:11px;font-size:14px;
  opacity:0;transition:.26s;z-index:200;box-shadow:var(--halo-hi);max-width:88vw;text-align:center}
.toast.is-in{opacity:1;transform:translate(-50%,0)}
.toast--error{color:#F5928C}
.toast--success{color:var(--ok)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== 登入 ===== */
#gate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:center;
  padding:calc(28px + var(--st)) calc(24px + var(--sr)) calc(28px + var(--sb)) calc(24px + var(--sl));
  background:radial-gradient(700px 420px at 50% 8%,rgba(217,169,60,.13),transparent 62%),
             linear-gradient(180deg,var(--bg2),var(--bg))}
.gate-in{width:100%;max-width:340px;margin:0 auto}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--gold);margin-bottom:10px}
#gate h1{font-size:24px}
.gsub{color:var(--dim);font-size:13.5px;margin:7px 0 28px}

/* ===== 頂欄 ===== */
.top{position:sticky;top:0;z-index:20;background:rgba(10,13,20,.9);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding-top:var(--st)}
.tin{max-width:720px;margin:0 auto;padding:12px calc(16px + var(--sr)) 12px calc(16px + var(--sl));
  display:flex;align-items:center;gap:12px}
.tin .ttl{font-size:16px;font-weight:700}
.tin .sub{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--gold)}
.burger{margin-left:auto;width:44px;height:44px;border:none;background:none;cursor:pointer;
  display:grid;place-items:center;gap:5px;flex:none;border-radius:11px;
  box-shadow:0 0 0 1px rgba(255,255,255,.1)}
.burger i{display:block;width:19px;height:2px;background:var(--gold-b);border-radius:2px}
.wrap{max-width:720px;margin:0 auto;
  padding:16px calc(16px + var(--sr)) calc(60px + var(--sb)) calc(16px + var(--sl))}

/* ===== 抽屜 ===== */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;
  pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:264px;max-width:82vw;z-index:70;
  background:var(--card);box-shadow:-8px 0 40px rgba(0,0,0,.5);transform:translateX(100%);
  transition:transform .28s cubic-bezier(.4,0,.2,1);
  padding:calc(20px + var(--st)) 16px calc(20px + var(--sb)) 16px;overflow-y:auto}
.drawer.on{transform:translateX(0)}
.drawer h3{font-size:12px;letter-spacing:.2em;color:var(--gold);
  font-family:var(--mono);margin:6px 0 14px}
.ditem{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;
  padding:14px 13px;border-radius:11px;cursor:pointer;color:var(--txt);font-size:15px;
  text-align:left;margin-bottom:6px}
.ditem span{font-size:19px;flex:none}
.ditem[aria-selected="true"]{background:rgba(217,169,60,.1);color:var(--gold-b);
  box-shadow:0 0 0 1px rgba(217,169,60,.4)}
.dsep{height:1px;background:rgba(255,255,255,.07);margin:12px 0}

/* ===== 待審核 ===== */
.item{padding:16px 17px;border-bottom:1px solid rgba(255,255,255,.05)}
.item:last-child{border-bottom:none}
.itop{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.inm{font-weight:700;font-size:15.5px}
.ity{color:var(--gold-b);font-size:14px}
.ih{margin-left:auto;font-family:var(--mono);font-weight:700;color:var(--gold-b);
  font-size:15px;white-space:nowrap;flex:none}
.im{font-family:var(--mono);font-size:12.5px;color:var(--dim);line-height:1.6}
.inn{font-size:13px;color:var(--dim);margin-top:4px}
.flg{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:700;
  background:rgba(229,168,63,.16);color:var(--warn)}
.arow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
.arow input{grid-column:1 / -1}
.bonus{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:12.5px;
  color:var(--dim);flex-wrap:wrap}
.bonus input{width:100px;flex:none;text-align:center;padding:10px}
.sw2{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;color:var(--txt)}
.sw2 input{width:19px;height:19px;accent-color:var(--gold);flex:none;padding:0}
.badge{display:inline-block;margin-left:7px;background:var(--warn);color:#1C1305;
  border-radius:10px;padding:0 8px;font-size:11px;font-weight:700;font-family:var(--mono)}

/* ===== 帳號 ===== */
.acc{padding:16px 17px;border-bottom:1px solid rgba(255,255,255,.05)}
.acc:last-child{border-bottom:none}
.ahd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.ahd b{font-size:16px}
.ahd .em{font-family:var(--mono);font-size:11.5px;color:var(--dim2);width:100%}
.st{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;
  white-space:nowrap;flex:none;margin-left:auto}
.st.on{background:rgba(79,190,129,.15);color:var(--ok)}
.st.off{background:rgba(141,150,172,.14);color:var(--dim)}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.bx{background:var(--bg);border-radius:10px;padding:11px 12px;
  box-shadow:0 0 0 1px rgba(255,255,255,.05);cursor:pointer}
.bx.ro{cursor:default}
.bx .k{font-size:11px;color:var(--dim);line-height:1.4}
.bx .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--gold-b);line-height:1.45}
.bx.ro .v{color:var(--txt)}
.bx .ed{font-size:10px;color:var(--dim2);margin-top:2px}
.editrow{display:flex;gap:8px;margin-top:9px;align-items:center}
.editrow input{flex:1}
.law{font-size:12.5px;color:var(--dim);line-height:1.7;margin-top:12px;
  background:rgba(255,255,255,.03);border-radius:10px;padding:11px 13px}
.law b{color:var(--gold-b);font-family:var(--mono)}
.abtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

/* ===== 行事曆 ===== */
.cal{padding:13px 17px;border-bottom:1px solid rgba(255,255,255,.05);display:flex;
  align-items:center;gap:11px}
.cal:last-child{border-bottom:none}
.cal .d{font-family:var(--mono);font-size:14px;font-weight:600;flex:none}
.cal .tp{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;flex:none}
.tp.holiday{background:rgba(224,96,90,.15);color:var(--bad)}
.tp.workday{background:rgba(79,190,129,.15);color:var(--ok)}
.cal .lb2{font-size:13px;color:var(--dim);flex:1}
.cal .rm{background:none;border:none;color:var(--dim2);cursor:pointer;font-size:19px;
  padding:4px 8px;flex:none;width:auto}

/* ===== 結算 ===== */
.stl{padding:15px 17px;border-bottom:1px solid rgba(255,255,255,.05)}
.stl:last-child{border-bottom:none}
.stl .h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.stl .h b{font-size:15px}
.stl .hr{margin-left:auto;font-family:var(--mono);font-weight:700;color:var(--warn);font-size:16px}
.stl .r{font-size:12.5px;color:var(--dim);line-height:1.6}
.paid{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;
  background:rgba(79,190,129,.15);color:var(--ok)}
.unpaid{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700;
  background:rgba(229,168,63,.16);color:var(--warn)}

/* ===== 紀錄 ===== */
.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:15px 16px;
  border-bottom:1px solid var(--line)}
.filters .full{grid-column:1 / -1}
.rec{padding:15px 17px;border-bottom:1px solid rgba(255,255,255,.05)}
.rec:last-child{border-bottom:none}
.trail{margin-top:9px;padding-top:9px;border-top:1px dashed rgba(255,255,255,.08);
  font-size:12px;color:var(--dim2);line-height:1.85}
.trail b{font-family:var(--mono);color:var(--dim)}
.termtag{font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:700;
  background:rgba(141,150,172,.14);color:var(--dim)}

</style>
</head>
<body>
<section id="gate">
  <div class="gate-in">
    <div class="brand">TPS · 後台</div>
    <h1>秘書長審核台</h1>
    <p class="gsub">請輸入後台密碼</p>
    <div id="gErr" class="err hide"></div>
    <div class="field"><input type="password" id="gPw" placeholder="密碼"></div>
    <button class="btn" id="gBtn">進入</button>
  </div>
</section>

<div id="app" class="hide">
<header class="top"><div class="tin">
  <div><div class="sub">TPS · 後台</div><div class="ttl" id="pageTitle">審核</div></div>
  <button class="burger" id="burger" aria-label="選單"><i></i><i></i><i></i></button>
</div></header>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <h3>選單</h3>
  <button class="ditem" data-p="Rev" aria-selected="true"><span>📥</span>審核</button>
  <button class="ditem" data-p="Acc" aria-selected="false"><span>👤</span>帳號與時數</button>
  <button class="ditem" data-p="Log" aria-selected="false"><span>🗂️</span>完整紀錄</button>
  <button class="ditem" data-p="Cal" aria-selected="false"><span>📅</span>行事曆</button>
  <button class="ditem" data-p="Set" aria-selected="false"><span>💰</span>到期結算</button>
  <div class="dsep"></div>
  <button class="ditem" id="dOut"><span>🚪</span>登出</button>
</aside>

<main class="wrap">
  <!-- 審核 -->
  <div id="pRev">
    <section class="card">
      <div class="chd"><h2>請假</h2><span class="unit" id="cL">0 筆</span></div>
      <div id="lList"><div class="empty">沒有待審的假單。</div></div>
    </section>
    <section class="card">
      <div class="chd"><h2>加班</h2><span class="unit" id="cO">0 筆</span></div>
      <div id="oList"><div class="empty">沒有待審的加班單。</div></div>
    </section>
  </div>

  <!-- 帳號 -->
  <div id="pAcc" class="hide">
    <section class="card">
      <div class="chd"><h2>帳號與時數</h2><span class="unit">點數字可直接改</span></div>
      <div id="accList"><div class="empty">載入中…</div></div>
    </section>
  </div>

  <!-- 紀錄 -->
  <div id="pLog" class="hide">
    <section class="card">
      <div class="filters">
        <select id="fWho" class="full"><option value="">全部人員</option></select>
        <select id="fKind"><option value="">請假＋加班</option>
          <option value="leave">只看請假</option><option value="overtime">只看加班</option></select>
        <select id="fStat"><option value="">全部狀態</option>
          <option value="pending">待審核</option><option value="approved">同意</option>
          <option value="rejected">不同意</option><option value="cancelled">已撤銷</option></select>
        <select id="fRange" class="full">
          <option value="m">本月</option><option value="y" selected>今年</option>
          <option value="ly">去年</option><option value="all">全部</option>
          <option value="custom">自訂期間</option></select>
        <div class="full hide" id="customRange">
          <div class="row2"><input type="date" id="fFrom"><input type="date" id="fTo"></div>
        </div>
      </div>
      <div class="chd" style="border-top:none"><h2>結果</h2><span class="unit" id="logCnt">—</span></div>
      <div id="logList"><div class="empty">載入中…</div></div>
    </section>
  </div>
  <!-- 行事曆 -->
  <div id="pCal" class="hide">
    <section class="card">
      <div class="chd"><h2>新增</h2><span class="unit">國定假日 / 補班日</span></div>
      <div class="cbd">
        <div class="info">國定假日 = 那天不算時數。<br>
          補班日 = 那天要上班，就算是星期六也算時數。<br>
          依行政院人事行政總處公告輸入。</div>
        <div class="field"><label class="lb">日期</label><input type="date" id="calDate"></div>
        <div class="field"><label class="lb">類型</label><select id="calType">
          <option value="holiday">國定假日（放假）</option>
          <option value="workday">補班日（上班）</option></select></div>
        <div class="field"><label class="lb">說明</label>
          <input type="text" id="calLabel" placeholder="例如 春節、國慶日、補班"></div>
        <button class="btn" id="calAdd">新增</button>
      </div>
    </section>
    <section class="card">
      <div class="chd"><h2>已設定</h2>
        <select id="calYear" style="width:auto;padding:6px 30px 6px 10px;font-size:13px"></select></div>
      <div id="calList"><div class="empty">載入中…</div></div>
    </section>
  </div>

  <!-- 到期結算 -->
  <div id="pSet" class="hide">
    <section class="card">
      <div class="chd"><h2>到期折算薪資</h2><span class="unit" id="setCnt">—</span></div>
      <div class="info" style="margin:14px 16px 0">遞延期滿沒休完的時數會列在這裡，依規定要折算薪資發給本人。<br>
        發放後請按「標記已發」，系統會留下紀錄。</div>
      <div id="setList"><div class="empty">載入中…</div></div>
    </section>
  </div>
</main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
<script>
if(!window.TPS){
  document.body.innerHTML =
    '<div style="padding:70px 26px;text-align:center;font-family:system-ui;color:#EAEDF4">' +
    '<div style="font-size:44px">🔄</div><h2 style="margin:12px 0 8px">需要重新載入</h2>' +
    '<p style="color:#8D96AC;font-size:14px;line-height:1.7">瀏覽器沒有載到最新的程式檔。<br>' +
    '請下拉重新整理，或關掉分頁重開。</p>' +
    '<button style="margin-top:18px;padding:12px 26px;border:none;border-radius:10px;' +
    'background:#D9A93C;color:#1C1305;font-weight:700;font-size:15px" ' +
    'onclick="location.reload(true)">重新載入</button></div>';
  throw new Error('shared.js 未載入');
}
var T = window.TPS, el = T.el, esc = T.esc, toast = T.toast, roundHalf = T.roundHalf;
T.setErrorHandler(function(e){ toast('讀取失敗：' + (e.message || e), 'error'); });

var S = { page:'Rev', unsub:[], busy:false, nL:0, nO:0, accounts:[], bals:{} };
var TITLE = { Rev:'審核', Acc:'帳號與時數', Log:'完整紀錄', Cal:'行事曆', Set:'到期結算' };
function showErr(id,msg){ var b=el('#'+id);
  if(!msg){ b.classList.add('hide'); return; } b.textContent=msg; b.classList.remove('hide'); }

/* ---------- 進入 ---------- */
el('#gBtn').onclick = function(){
  showErr('gErr','');
  if(!T.adminLogin(el('#gPw').value)) return showErr('gErr','密碼不正確。');
  el('#gate').classList.add('hide');
  el('#app').classList.remove('hide');
  boot();
};
el('#gPw').addEventListener('keydown', function(e){ if(e.key==='Enter') el('#gBtn').click(); });
el('#dOut').onclick = function(){
  S.unsub.forEach(function(f){ f(); }); S.unsub = [];
  T.adminLogout(); closeDrawer();
  el('#app').classList.add('hide'); el('#gate').classList.remove('hide'); el('#gPw').value='';
};

function boot(){
  S.unsub.push(T.watchPendingLeaves(renderLeaves));
  S.unsub.push(T.watchPendingOvertime(renderOts));
  T.loadCalendar()
   .then(function(){ return T.checkAllExpiry(); })
   .then(function(list){
     if(list.length) toast(list.length + ' 人有時數到期，請到「到期結算」確認','info');
     return T.autoGrantAll();
   })
   .then(function(g){
     if(g.length) toast(g.length + ' 人到職週年，特休已自動發放','success');
     loadAccounts();
   })
   .catch(function(e){ console.warn(e); loadAccounts(); });
}

/* ---------- 行事曆 ---------- */
function loadCal(){
  var sel = el('#calYear');
  if(!sel.options.length){
    var y = new Date().getFullYear(), o = '';
    for(var i = y + 2; i >= y - 1; i--) o += '<option value="'+i+'">'+i+' 年</option>';
    sel.innerHTML = o; sel.value = y;
    sel.onchange = loadCal;
  }
  T.listCalendar(sel.value).then(function(list){
    var box = el('#calList');
    if(!list.length){ box.innerHTML = '<div class="empty">' + sel.value + ' 年還沒有設定。</div>'; return; }
    box.innerHTML = '';
    list.forEach(function(c){
      var d = document.createElement('div'); d.className = 'cal';
      d.innerHTML = '<span class="d">' + c.date.slice(5) + '</span>' +
        '<span class="tp ' + c.type + '">' + (c.type==='holiday'?'放假':'上班') + '</span>' +
        '<span class="lb2">' + esc(c.label || '') + '</span>';
      var rm = document.createElement('button');
      rm.className = 'rm'; rm.textContent = '✕';
      rm.onclick = function(){
        if(!confirm('刪除 ' + c.date + ' 的設定？')) return;
        T.deleteCalendarDay(c.date).then(function(){ toast('已刪除','success'); loadCal(); })
         .catch(function(e){ toast(e.message,'error'); });
      };
      d.appendChild(rm);
      box.appendChild(d);
    });
  }).catch(function(e){ toast(e.message,'error'); });
}
el('#calAdd').onclick = function(){
  var d = el('#calDate').value, t = el('#calType').value, l = el('#calLabel').value.trim();
  if(!d) return toast('請選日期','error');
  T.setCalendarDay(d, t, l).then(function(){
    toast('已新增','success');
    el('#calDate').value = ''; el('#calLabel').value = '';
    var y = el('#calYear'); if(y.value !== d.slice(0,4) && y.querySelector('option[value="'+d.slice(0,4)+'"]')) y.value = d.slice(0,4);
    loadCal();
  }).catch(function(e){ toast(e.message,'error'); });
};

/* ---------- 到期結算 ---------- */
function loadSettle(){
  T.listSettlements().then(function(list){
    el('#setCnt').textContent = list.length + ' 筆';
    var box = el('#setList');
    if(!list.length){ box.innerHTML = '<div class="empty">目前沒有到期需要折算的時數。</div>'; return; }
    var nameOf = {};
    S.accounts.forEach(function(a){ nameOf[a.email] = a.name; });
    box.innerHTML = '';
    list.forEach(function(x){
      var d = document.createElement('div'); d.className = 'stl';
      d.innerHTML = '<div class="h"><b>' + esc(nameOf[x.email] || x.email) + '</b>' +
        '<span class="' + (x.paid ? 'paid' : 'unpaid') + '">' +
          (x.paid ? '已發放' : '待發放') + '</span>' +
        '<span class="hr">' + x.hours + ' 小時</span></div>' +
        '<div class="r">' + (x.kind === 'annual' ? '特別休假' : '加班補休') +
          '　' + x.year + ' 年度</div>' +
        '<div class="r">' + esc(x.reason || '') + '</div>' +
        '<div class="r">產生時間 ' + T.fmtStamp(x.createdAt) + '</div>';
      var b = document.createElement('button');
      b.className = 'btn ' + (x.paid ? 'ghost' : 'ok') + ' sm';
      b.style.marginTop = '11px'; b.style.width = '100%';
      b.textContent = x.paid ? '取消已發放標記' : '標記已發放';
      b.onclick = function(){
        T.markSettlementPaid(x.id, !x.paid)
         .then(function(){ toast('已更新','success'); loadSettle(); })
         .catch(function(e){ toast(e.message,'error'); });
      };
      d.appendChild(b);
      box.appendChild(d);
    });
  }).catch(function(e){ toast(e.message,'error'); });
}

/* ---------- 抽屜 ---------- */
function openDrawer(){ el('#drawer').classList.add('on'); el('#scrim').classList.add('on'); }
function closeDrawer(){ el('#drawer').classList.remove('on'); el('#scrim').classList.remove('on'); }
el('#burger').onclick = openDrawer;
el('#scrim').onclick = closeDrawer;
Array.prototype.forEach.call(document.querySelectorAll('.ditem[data-p]'), function(b){
  b.onclick = function(){
    S.page = b.dataset.p;
    Array.prototype.forEach.call(document.querySelectorAll('.ditem[data-p]'), function(x){
      x.setAttribute('aria-selected', x === b); });
    ['Rev','Acc','Log','Cal','Set'].forEach(function(p){ el('#p'+p).classList.toggle('hide', p !== S.page); });
    el('#pageTitle').textContent = TITLE[S.page];
    closeDrawer(); window.scrollTo(0,0);
    if(S.page === 'Acc') loadAccounts();
    if(S.page === 'Log') loadLog();
    if(S.page === 'Cal') loadCal();
    if(S.page === 'Set') loadSettle();
  };
});

/* ---------- 同意／駁回 ---------- */
function actions(onOk, onNo){
  var w = document.createElement('div'); w.className = 'arow';
  var note = document.createElement('input');
  note.placeholder = '註記（選填，申請人看得到）';
  var ok = document.createElement('button'); ok.className='btn ok sm'; ok.textContent='同意';
  var no = document.createElement('button'); no.className='btn no sm'; no.textContent='不同意';
  function run(fn, verb){
    if(S.busy) return;
    S.busy = true; ok.disabled = no.disabled = true;
    fn(note.value.trim()).then(function(){ toast('已'+verb,'success'); })
     .catch(function(e){ toast(e.message,'error'); ok.disabled = no.disabled = false; })
     .then(function(){ S.busy = false; });
  }
  ok.onclick = function(){ run(onOk,'同意'); };
  no.onclick = function(){ if(confirm('確定駁回？')) run(onNo,'駁回'); };
  w.appendChild(note); w.appendChild(ok); w.appendChild(no);
  return w;
}
function badge(){
  var n = S.nL + S.nO;
  el('#pageTitle').textContent = TITLE[S.page] + (S.page==='Rev' && n ? '' : '');
  var d = document.querySelector('.ditem[data-p="Rev"]');
  var old = d.querySelector('.badge'); if(old) old.remove();
  if(n){ var s = document.createElement('span'); s.className='badge'; s.textContent=n; d.appendChild(s); }
}

function renderLeaves(list){
  S.nL = list.length; el('#cL').textContent = list.length + ' 筆'; badge();
  var box = el('#lList');
  if(!list.length){ box.innerHTML = '<div class="empty">沒有待審的假單。</div>'; return; }
  box.innerHTML = '';
  list.forEach(function(r){
    var label = (r.type==='other' && r.otherType) ? r.otherType : T.leaveTypeLabel(r.type);
    var d = document.createElement('div'); d.className = 'item';
    var h = '<div class="itop"><span class="inm">' + esc(r.name) + '</span>' +
      '<span class="ity">' + esc(label) + '</span>' +
      (r.isLate ? '<span class="flg">事後補請</span>' : '') +
      (r.segments && r.segments.length > 1 ? '<span class="flg">跨月</span>' : '') +
      '<span class="ih">' + r.hours + ' 小時</span></div>' +
      '<div class="im">' + T.fmtDateTime(r.startAt) + ' → ' + T.fmtDateTime(r.endAt) + '</div>' +
      '<div class="im">送出 ' + T.fmtStamp(r.createdAt) + '</div>';
    if(r.annualHours > 0) h += '<div class="inn">扣特休 ' + r.annualHours + ' 小時</div>';
    if(r.compHours > 0)   h += '<div class="inn">扣補休 ' + r.compHours + ' 小時</div>';
    if(r.segments && r.segments.length > 1)
      h += '<div class="inn">分月計入：' + r.segments.map(function(s){
        return s.ym + ' ' + s.hours + 'h'; }).join('、') + '</div>';
    if(r.isLate && r.lateReason) h += '<div class="inn">補請原因：' + esc(r.lateReason) + '</div>';
    if(r.needsProxy) h += '<div class="inn">職務代理人：' + esc(r.proxyName || '未填') + '</div>';
    d.innerHTML = h;
    d.appendChild(actions(
      function(n){ return T.reviewLeave(r.id, T.STATUS.APPROVED, n); },
      function(n){ return T.reviewLeave(r.id, T.STATUS.REJECTED, n); }));
    box.appendChild(d);
  });
}

function renderOts(list){
  S.nO = list.length; el('#cO').textContent = list.length + ' 筆'; badge();
  var box = el('#oList');
  if(!list.length){ box.innerHTML = '<div class="empty">沒有待審的加班單。</div>'; return; }
  box.innerHTML = '';
  list.forEach(function(o){
    var d = document.createElement('div'); d.className = 'item';
    d.innerHTML = '<div class="itop"><span class="inm">' + esc(o.name) + '</span>' +
      '<span class="ity">加班</span>' +
      (o.overCapWarning ? '<span class="flg">本月逾 46 小時</span>' : '') +
      '<span class="ih">' + o.hours + ' 小時</span></div>' +
      '<div class="im">' + T.fmtDate(o.date) + '　' + T.fmtTime(o.startAt) + ' – ' + T.fmtTime(o.endAt) + '</div>' +
      '<div class="im">送出 ' + T.fmtStamp(o.createdAt) + '</div>' +
      (o.reason ? '<div class="inn">事由：' + esc(o.reason) + '</div>' : '') +
      '<div class="bonus"><label class="sw2"><input type="checkbox" id="dp_' + o.id + '"' +
        (o.isWeekend ? ' checked' : '') + '>這是核派加班（補休加倍）</label></div>' +
      '<div class="im" id="dpv_' + o.id + '"></div>';
    d.appendChild(actions(
      function(n){
        return T.reviewOvertime(o.id, T.STATUS.APPROVED, n,
          { isDispatch: el('#dp_' + o.id).checked });
      },
      function(n){ return T.reviewOvertime(o.id, T.STATUS.REJECTED, n); }));
    box.appendChild(d);
    var cb = el('#dp_' + o.id), pv = el('#dpv_' + o.id);
    function upd(){
      pv.textContent = cb.checked
        ? '核准後補休 +' + roundHalf(o.hours * 2) + ' 小時（' + o.hours + ' × 2）'
        : '核准後補休 +' + o.hours + ' 小時';
    }
    cb.onchange = upd; upd();
  });
}

/* ---------- 帳號與時數 ---------- */
function loadAccounts(){
  return T.listAccounts().then(function(list){
    S.accounts = list;
    return Promise.all(list.map(function(a){
      return T.getBalance(a.email).then(function(b){ S.bals[a.email] = b; });
    }));
  }).then(function(){
    fillWhoFilter();
    return Promise.all(S.accounts.map(function(a){
      return Promise.all([
        T.fetchAllRecords({ email:a.email, kind:'leave' }),
        T.fetchAllRecords({ email:a.email, kind:'overtime' })
      ]).then(function(r){ a._lv = r[0]; a._ot = r[1]; });
    }));
  }).then(renderAccounts).catch(function(e){ toast(e.message,'error'); });
}

var THIS_MONTH = (function(){ var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })();

function renderAccounts(){
  var box = el('#accList');
  if(!S.accounts.length){ box.innerHTML = '<div class="empty">還沒有任何帳號。</div>'; return; }
  box.innerHTML = '';
  S.accounts.forEach(function(a){
    var b = S.bals[a.email] || {};
    var moL = T.monthLeaveHours(a._lv || [], THIS_MONTH);
    var moO = T.monthOvertimeHours(a._ot || [], THIS_MONTH);
    var d = document.createElement('div'); d.className = 'acc';
    d.innerHTML =
      '<div class="ahd"><b>' + esc(a.name || '（未設定姓名）') + '</b>' +
        (a.term > 1 ? '<span class="termtag">第 ' + a.term + ' 任</span>' : '') +
        '<span class="st ' + (a.active === false ? 'off' : 'on') + '">' +
          (a.active === false ? '已停用' : '在職') + '</span>' +
        '<span class="em">' + esc(a.email) + '</span></div>' +
      '<div class="grid4">' +
        boxHtml(a.email, 'annualCarry',   '特休 · 去年遞延', b.annualCarry   || 0, true) +
        boxHtml(a.email, 'annualCurrent', '特休 · 今年',     b.annualCurrent || 0, true) +
        boxHtml(a.email, 'compCarry',     '補休 · 去年遞延', b.compCarry     || 0, true) +
        boxHtml(a.email, 'compCurrent',   '補休 · 今年',     b.compCurrent   || 0, true) +
        boxHtml(a.email, '_moL',          '本月已請假',      moL, false) +
        boxHtml(a.email, '_moO',          '本月已加班',      moO, false) +
      '</div>' + lawHtml(a);
    var btns = document.createElement('div'); btns.className = 'abtns';
    btns.appendChild(mkBtn('改姓名', 'ghost', function(){ doRename(a); }));
    btns.appendChild(mkBtn('重設密碼', 'ghost', function(){ doResetPw(a); }));
    btns.appendChild(mkBtn('設定到職日', 'ghost', function(){ doHire(a); }));
    btns.appendChild(mkBtn('換人接手', 'no', function(){ doHandover(a); }));
    d.appendChild(btns);
    box.appendChild(d);
  });
  bindBoxes();
}
function mkBtn(text, cls, fn){
  var b = document.createElement('button');
  b.className = 'btn ' + cls + ' sm'; b.style.width = '100%';
  b.textContent = text; b.onclick = fn; return b;
}
function boxHtml(email, key, label, val, editable){
  return '<div class="bx' + (editable ? '' : ' ro') + '"' +
    (editable ? ' data-em="' + esc(email) + '" data-k="' + key + '"' : '') + '>' +
    '<div class="k">' + label + '</div><div class="v">' + val + '</div>' +
    (editable ? '<div class="ed">點一下可修改</div>' : '') + '</div>';
}
function lawHtml(a){
  if(!a.hireDate) return '<div class="law">還沒設到職日，設了就會自動算法定特休</div>';
  var at = a.resignDate ? T.toDate(a.resignDate) : new Date();
  var sn = T.seniority(a.hireDate, at), dy = T.annualLeaveDays(a.hireDate, at);
  var h = '<div class="law">到職 ' + T.fmtDate(a.hireDate) + '　年資 <b>' + sn.years +
    '</b> 年 <b>' + sn.months + '</b> 個月<br>法定特休 <b>' + dy + '</b> 日（<b>' +
    (dy * T.HOURS_PER_DAY) + '</b> 小時）';
  var up = T.nextUpgrade(a.hireDate, at);
  if(up && !a.resignDate)
    h += '<br>下次調升 ' + T.fmtDate(up.date) + ' → ' + up.days + ' 日（' + up.hours + ' 小時）';
  return h + '</div>';
}

/* 點數字直接改（學遊戲後台那套） */
function bindBoxes(){
  Array.prototype.forEach.call(document.querySelectorAll('.bx[data-k]'), function(bx){
    bx.onclick = function(){
      if(bx.querySelector('.editrow')) return;
      var cur = bx.querySelector('.v').textContent;
      var row = document.createElement('div'); row.className = 'editrow';
      var inp = document.createElement('input');
      inp.type = 'number'; inp.step = '0.5'; inp.value = cur;
      var ok = document.createElement('button');
      ok.className = 'btn sm'; ok.textContent = '設為';
      row.appendChild(inp); row.appendChild(ok);
      bx.appendChild(row);
      inp.focus(); inp.select();
      ok.onclick = function(ev){
        ev.stopPropagation();
        var v = parseFloat(inp.value);
        if(isNaN(v)) return toast('請填數字','error');
        setField(bx.dataset.em, bx.dataset.k, roundHalf(v));
      };
      inp.onclick = function(ev){ ev.stopPropagation(); };
      inp.addEventListener('keydown', function(ev){ if(ev.key==='Enter') ok.click(); });
    };
  });
}
function setField(email, key, val){
  var b = S.bals[email] || {};
  var patch = {}; patch[key] = val; patch.updatedAt = T.serverTimestamp();
  var yearEnd = T.Timestamp.fromDate(new Date(new Date().getFullYear() + '-12-31T23:59:59'));
  if(key === 'annualCarry' || key === 'annualCurrent'){
    var ac = key === 'annualCarry'   ? val : (b.annualCarry   || 0);
    var au = key === 'annualCurrent' ? val : (b.annualCurrent || 0);
    patch.annualRemaining = roundHalf(ac + au);
    if(key === 'annualCarry' && val > 0 && !b.annualCarryExpire) patch.annualCarryExpire = yearEnd;
  }
  if(key === 'compCarry' || key === 'compCurrent'){
    var cc = key === 'compCarry'   ? val : (b.compCarry   || 0);
    var cu = key === 'compCurrent' ? val : (b.compCurrent || 0);
    patch.compRemaining = roundHalf(cc + cu);
    if(key === 'compCarry' && val > 0 && !b.compCarryExpire) patch.compCarryExpire = yearEnd;
  }
  T.setMerge(T.COL.balances, email, patch)
   .then(function(){ return T.writeAudit('balance.edit', email,
      { key:key, from:(b[key] || 0) }, { key:key, to:val }); })
   .then(function(){ toast('已更新','success'); loadAccounts(); })
   .catch(function(e){ toast(e.message,'error'); });
}

function doRename(a){
  var n = prompt('修改姓名', a.name || '');
  if(n === null) return;
  n = n.trim();
  if(!n) return toast('姓名不能空白','error');
  T.upsertAccount(a.email, { name:n })
   .then(function(){ return T.writeAudit('account.rename', a.email, { name:a.name }, { name:n }); })
   .then(function(){ toast('已改為 ' + n,'success'); loadAccounts(); })
   .catch(function(e){ toast(e.message,'error'); });
}
function doResetPw(a){
  if(!confirm('把「' + (a.name || a.email) + '」的密碼重設為 ' + T.DEFAULT_PW + '？')) return;
  T.resetPassword(a.email)
   .then(function(pw){ alert('密碼已重設為：' + pw + '\n\n請通知她登入後自行修改。'); })
   .catch(function(e){ toast(e.message,'error'); });
}
function doHire(a){
  var cur = a.hireDate ? T.fmtDate(a.hireDate).replace(/\//g,'-') : '';
  var v = prompt('到職日（格式 2024-03-01）', cur);
  if(v === null) return;
  var d = v.trim() ? new Date(v.trim() + 'T00:00:00') : null;
  if(v.trim() && isNaN(d)) return toast('日期格式不對','error');
  T.upsertAccount(a.email, { hireDate: d ? T.Timestamp.fromDate(d) : null })
   .then(function(){ toast('已更新到職日','success'); loadAccounts(); })
   .catch(function(e){ toast(e.message,'error'); });
}
function doHandover(a){
  var lv = (a._lv || []).length, ot = (a._ot || []).length;
  if(!confirm('「' + a.email + '」換人接手？\n\n' +
    '現任：' + (a.name || '未設定') + '\n' +
    '這個信箱目前有 ' + lv + ' 筆假單、' + ot + ' 筆加班單。\n\n' +
    '執行後：時數全部歸零、密碼回到 ' + T.DEFAULT_PW + '。\n' +
    '舊紀錄新秘書看不到，但後台的「完整紀錄」查得到。')) return;
  var n = prompt('新任秘書的中文姓名');
  if(n === null || !n.trim()) return;
  var h = prompt('新任秘書的到職日（格式 2026-09-01，可留空）', '');
  if(h === null) return;
  var d = h.trim() ? new Date(h.trim() + 'T00:00:00') : null;
  T.handoverAccount(a.email, n.trim(), d)
   .then(function(r){
     alert('已完成換人\n\n姓名：' + n.trim() + '\n任期：第 ' + r.term + ' 任\n密碼：' + r.password);
     loadAccounts();
   })
   .catch(function(e){ toast(e.message,'error'); });
}

/* ---------- 完整紀錄 ---------- */
function fillWhoFilter(){
  var cur = el('#fWho').value;
  el('#fWho').innerHTML = '<option value="">全部人員</option>' +
    S.accounts.map(function(a){
      return '<option value="' + esc(a.email) + '">' + esc(a.name || a.email) + '</option>';
    }).join('');
  el('#fWho').value = cur;
}
el('#fRange').onchange = function(){
  el('#customRange').classList.toggle('hide', el('#fRange').value !== 'custom');
  if(el('#fRange').value !== 'custom') loadLog();
};
['#fWho','#fKind','#fStat','#fFrom','#fTo'].forEach(function(i){ el(i).onchange = loadLog; });

function rangeOf(v){
  var y = new Date().getFullYear(), m = new Date().getMonth();
  if(v === 'm')  return { from:new Date(y, m, 1), to:new Date(y, m+1, 0) };
  if(v === 'y')  return { from:new Date(y, 0, 1), to:new Date(y, 11, 31) };
  if(v === 'ly') return { from:new Date(y-1, 0, 1), to:new Date(y-1, 11, 31) };
  if(v === 'custom') return {
    from: el('#fFrom').value ? new Date(el('#fFrom').value + 'T00:00:00') : null,
    to:   el('#fTo').value   ? new Date(el('#fTo').value + 'T00:00:00')   : null };
  return { from:null, to:null };
}

function loadLog(){
  var r = rangeOf(el('#fRange').value);
  el('#logList').innerHTML = '<div class="empty">載入中…</div>';
  T.fetchAllRecords({
    email: el('#fWho').value || null,
    kind:  el('#fKind').value || null,
    status:el('#fStat').value || null,
    from: r.from, to: r.to
  }).then(function(list){
    el('#logCnt').textContent = list.length + ' 筆';
    var box = el('#logList');
    if(!list.length){ box.innerHTML = '<div class="empty">這個範圍沒有紀錄。</div>'; return; }
    box.innerHTML = list.map(logCard).join('');
  }).catch(function(e){
    el('#logList').innerHTML = '<div class="empty">載入失敗：' + esc(e.message) + '</div>';
  });
}

function logCard(r){
  var isLeave = r.kind === 'leave';
  var label = isLeave
    ? ((r.type==='other' && r.otherType) ? r.otherType : T.leaveTypeLabel(r.type))
    : '加班';
  var when = isLeave
    ? T.fmtDateTime(r.startAt) + ' → ' + T.fmtDateTime(r.endAt)
    : T.fmtDate(r.date) + '　' + T.fmtTime(r.startAt) + ' – ' + T.fmtTime(r.endAt);
  var h = '<div class="rec"><div class="itop">' +
    '<span class="inm">' + esc(r.name) + '</span>' +
    (r.term > 1 ? '<span class="termtag">第 ' + r.term + ' 任</span>' : '') +
    '<span class="ity">' + esc(label) + '</span>' +
    '<span class="tag ' + r.status + '">' + T.STATUS_LABEL[r.status] + '</span>' +
    '<span class="ih">' + r.hours + ' 小時</span></div>' +
    '<div class="im">' + when + '</div>';
  if(!isLeave && r.bonusHours > 0) h += '<div class="inn">核派增額 +' + r.bonusHours + ' 小時</div>';
  if(r.reason) h += '<div class="inn">事由：' + esc(r.reason) + '</div>';
  h += '<div class="trail">送出　<b>' + T.fmtStamp(r.createdAt) + '</b>　' + esc(r.name);
  if(r.status === 'approved' || r.status === 'rejected')
    h += '<br>' + (r.status === 'approved' ? '同意' : '駁回') + '　<b>' +
      T.fmtStamp(r.reviewedAt) + '</b>　' + esc(r.reviewedBy || '');
  if(r.status === 'cancelled')
    h += '<br>撤銷　<b>' + T.fmtStamp(r.cancelledAt) + '</b>　' + esc(r.cancelledBy || '');
  if(r.status === 'pending') h += '<br>尚未審核';
  if(r.adminNote) h += '<br>註記：' + esc(r.adminNote);
  return h + '</div></div>';
}

</script>
