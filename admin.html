<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>後台 — 請假加班系統</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0D14; --bg2:#0F141F; --card:#151C2B; --card2:#1C2436;
  --gold:#D9A93C; --gold-b:#F5D583; --line:rgba(217,169,60,.18);
  --txt:#EAEDF4; --dim:#8D96AC; --dim2:#5C6478;
  --ok:#4FBE81; --warn:#E5A83F; --bad:#E0605A;
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Noto Sans TC',system-ui,sans-serif;
  --halo:0 0 0 1px var(--line), 0 0 30px rgba(217,169,60,.10);
  --halo-hi:0 0 0 1px rgba(217,169,60,.5), 0 0 40px rgba(217,169,60,.25);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--txt);font-size:15px;line-height:1.6;min-height:100dvh;
  background:radial-gradient(800px 460px at 50% -8%,rgba(217,169,60,.11),transparent 62%),
             linear-gradient(180deg,var(--bg2),var(--bg));background-attachment:fixed;
  padding-bottom:env(safe-area-inset-bottom)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.3;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px)}
body>*{position:relative;z-index:2}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-weight:700;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hide{display:none!important}

.wrap{max-width:560px;margin:0 auto;padding:18px 16px 100px}
.gate{min-height:100dvh;display:grid;place-items:center;padding:22px}
.card{background:var(--card);border-radius:14px;box-shadow:var(--halo);margin-bottom:14px}
.card.glow{box-shadow:var(--halo-hi)}
.chd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.chd h2{font-size:14.5px;letter-spacing:.03em}
.unit{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--dim2)}
.cbd{padding:18px}

.brand{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--gold);margin-bottom:9px}
.sub{color:var(--dim);font-size:13px}

.field{margin-bottom:15px}
label.lb{display:block;font-size:12.5px;color:var(--dim);margin-bottom:6px}
.hint{font-size:12px;color:var(--dim2);margin-top:6px;line-height:1.5}
input,select,textarea{width:100%;padding:11px 13px;background:var(--bg);color:var(--txt);
  border:1px solid rgba(255,255,255,.09);border-radius:9px;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(217,169,60,.14)}
::placeholder{color:var(--dim2)}
textarea{min-height:70px;resize:vertical;font-size:15px}
input[type=date],input[type=time],input[type=number]{font-family:var(--mono)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{background:linear-gradient(145deg,var(--gold-b),var(--gold));color:#1C1305;border:none;
  border-radius:10px;padding:13px 22px;font-weight:700;cursor:pointer;font-size:15px;
  box-shadow:0 0 24px rgba(217,169,60,.28)}
.btn:active{transform:scale(.985)}
.btn:disabled{background:#2B3243;color:var(--dim2);box-shadow:none}
.btn.wide{width:100%}
.btn.sm{padding:8px 15px;font-size:13px;border-radius:8px}
.btn.ghost{background:none;color:var(--dim);box-shadow:0 0 0 1px rgba(255,255,255,.13)}
.btn.ghost:active{color:var(--gold)}
.btn.ok{background:linear-gradient(145deg,#6ED09A,var(--ok));color:#06210F;box-shadow:0 0 18px rgba(79,190,129,.3)}
.btn.no{background:none;color:var(--bad);box-shadow:0 0 0 1px rgba(224,96,90,.45)}

.err{background:rgba(224,96,90,.09);color:#F5928C;padding:11px 14px;border-radius:9px;
  font-size:13.5px;margin-bottom:15px;box-shadow:0 0 0 1px rgba(224,96,90,.3)}
.info{background:rgba(217,169,60,.07);color:var(--gold-b);padding:11px 14px;border-radius:9px;
  font-size:13px;margin-bottom:15px;box-shadow:0 0 0 1px var(--line)}
.empty{padding:38px 18px;text-align:center;color:var(--dim2);font-size:13.5px}

.tag{font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.tag.pending{background:rgba(229,168,63,.15);color:var(--warn)}
.tag.approved{background:rgba(79,190,129,.15);color:var(--ok)}
.tag.rejected{background:rgba(224,96,90,.15);color:var(--bad)}
.tag.cancelled{background:rgba(141,150,172,.13);color:var(--dim)}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:var(--card2);
  color:var(--txt);padding:12px 22px;border-radius:10px;font-size:14px;opacity:0;transition:.26s;
  z-index:99;box-shadow:var(--halo-hi);max-width:88vw;text-align:center}
.toast.is-in{opacity:1;transform:translate(-50%,0)}
.toast--error{color:#F5928C}
.toast--success{color:var(--ok)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}


/* --- 後台專屬 --- */
.wrap{max-width:720px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.tb{background:var(--card);border:none;border-radius:11px;padding:13px 8px;cursor:pointer;
  color:var(--dim);font-size:14px;font-weight:600;box-shadow:0 0 0 1px rgba(255,255,255,.05)}
.tb[aria-selected="true"]{color:var(--gold-b);box-shadow:var(--halo-hi)}
.tb .bd{display:inline-block;margin-left:6px;background:var(--warn);color:#1C1305;
  border-radius:10px;padding:0 7px;font-size:11px;font-weight:700;font-family:var(--mono)}
.item{padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.05)}
.item:last-child{border-bottom:none}
.itop{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.inm{font-weight:700;font-size:15.5px}
.ity{color:var(--gold-b);font-size:14px}
.ih{margin-left:auto;font-family:var(--mono);font-weight:700;color:var(--gold-b);font-size:15px}
.im{font-family:var(--mono);font-size:12.5px;color:var(--dim)}
.inn{font-size:13px;color:var(--dim);margin-top:4px}
.flg{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:700;
  background:rgba(229,168,63,.16);color:var(--warn)}
.arow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.arow input{flex:1;min-width:150px;font-size:14px;padding:9px 11px}
.bonus{display:flex;align-items:center;gap:10px;margin-top:11px;font-size:13px;color:var(--dim)}
.bonus input{max-width:100px;font-size:14px;padding:8px 10px}
.urow{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.05)}
.urow:last-child{border-bottom:none}
.uhd{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.uhd b{font-size:15px}
.uid{font-family:var(--mono);font-size:12px;color:var(--dim2)}
.uhd .st{margin-left:auto;font-size:11px;padding:2px 9px;border-radius:20px}
.st.on{background:rgba(79,190,129,.15);color:var(--ok)}
.st.off{background:rgba(141,150,172,.14);color:var(--dim)}
.ugrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:center}
.ugrid select,.ugrid input{font-size:14px;padding:9px 11px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.bx{background:var(--bg);border-radius:9px;padding:10px 12px;box-shadow:0 0 0 1px rgba(255,255,255,.05)}
.bx .k{font-size:11px;color:var(--dim)}
.bx .v{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--gold-b)}

</style>
</head>
<body>

<section id="gate" class="gate">
  <div style="width:100%;max-width:360px">
    <div class="card"><div class="cbd" style="padding:32px 26px">
      <div class="brand">TPS · 後台</div>
      <h1 style="font-size:20px">秘書長審核台</h1>
      <p class="sub" style="margin:6px 0 22px">輸入後台密碼。</p>
      <div id="gErr" class="err hide"></div>
      <div class="field"><input type="password" id="gpw" placeholder="密碼"></div>
      <button class="btn wide" id="gBtn">進入</button>
    </div></div>
  </div>
</section>

<div id="app" class="hide"><div class="wrap">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
    <div><div class="brand" style="margin:0">TPS · 後台</div>
      <div style="font-size:17px;font-weight:700">秘書長審核台</div></div>
    <button class="btn ghost sm" id="outBtn" style="margin-left:auto">登出</button>
  </div>

  <div class="tabs">
    <button class="tb" data-p="rev" aria-selected="true">待審核<span class="bd hide" id="bdAll">0</span></button>
    <button class="tb" data-p="ppl" aria-selected="false">人員</button>
    <button class="tb" data-p="bal" aria-selected="false">時數</button>
  </div>

  <div id="pRev">
    <section class="card">
      <div class="chd"><h2>請假</h2><span class="unit" id="cL">0 筆</span></div>
      <div id="lList"><div class="empty">沒有待審的假單。</div></div>
    </section>
    <section class="card">
      <div class="chd"><h2>加班</h2><span class="unit" id="cO">0 筆</span></div>
      <div id="oList"><div class="empty">沒有待審的加班單。</div></div>
    </section>
  </div>

  <div id="pPpl" class="hide">
    <section class="card">
      <div class="chd"><h2>人員</h2><span class="unit">身分・到職日</span></div>
      <div id="uList"><div class="empty">載入中…</div></div>
    </section>
  </div>

  <div id="pBal" class="hide">
    <section class="card">
      <div class="chd"><h2>目前時數</h2><span class="unit">單位：小時</span></div>
      <div id="bList"><div class="empty">載入中…</div></div>
    </section>
    <section class="card">
      <div class="chd"><h2>手動調整</h2><span class="unit">會留稽核紀錄</span></div>
      <div class="cbd">
        <div class="field"><label class="lb">對象</label><select id="aU"></select></div>
        <div class="field"><label class="lb">項目</label><select id="aK">
          <option value="annualRemaining">特別休假剩餘</option>
          <option value="compRemaining">加班補休剩餘</option>
        </select></div>
        <div class="field"><label class="lb">改成（小時）</label><input type="number" id="aV" step="0.5"></div>
        <div class="field"><label class="lb">原因</label><input type="text" id="aN" placeholder="例如 年度特休發放、匯入舊資料"></div>
        <button class="btn wide" id="aB">套用</button>
      </div>
    </section>
  </div>
</div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="shared.js?v=2.1.0"></script>
<script>

var T = window.TPS;
var el = T.el, esc = T.esc, toast = T.toast, roundHalf = T.roundHalf;
var S = { unsub:[], users:[], busy:false, nL:0, nO:0 };

function showErr(id,msg){ var b=el('#'+id); if(!msg){b.classList.add('hide');return;} b.textContent=msg; b.classList.remove('hide'); }

el('#gBtn').onclick = function(){
  showErr('gErr','');
  if(!T.adminLogin(el('#gpw').value)) return showErr('gErr','密碼不正確。');
  el('#gate').classList.add('hide'); el('#app').classList.remove('hide');
  boot();
};
el('#gpw').addEventListener('keydown', function(e){ if(e.key==='Enter') el('#gBtn').click(); });
el('#outBtn').onclick = function(){
  S.unsub.forEach(function(f){ f(); }); S.unsub = [];
  T.adminLogout();
  el('#app').classList.add('hide'); el('#gate').classList.remove('hide');
  el('#gpw').value = '';
};

function boot(){
  S.unsub.push(T.watchPending(renderLeaves));
  S.unsub.push(T.watchPendingOvertime(renderOts));
  refreshUsers();
}

Array.prototype.forEach.call(document.querySelectorAll('.tb'), function(t){
  t.onclick = function(){
    Array.prototype.forEach.call(document.querySelectorAll('.tb'), function(x){
      x.setAttribute('aria-selected', x === t);
    });
    ['rev','ppl','bal'].forEach(function(p){
      el('#p' + p[0].toUpperCase() + p.slice(1)).classList.toggle('hide', p !== t.dataset.p);
    });
    if(t.dataset.p === 'bal') renderBal();
    if(t.dataset.p === 'ppl') refreshUsers();
  };
});

/* ---------- 同意 / 駁回 ---------- */
function actions(onOk, onNo){
  var w = document.createElement('div'); w.className = 'arow';
  var note = document.createElement('input'); note.placeholder = '註記（選填，申請人看得到）';
  var ok = document.createElement('button'); ok.className = 'btn ok sm'; ok.textContent = '同意';
  var no = document.createElement('button'); no.className = 'btn no sm'; no.textContent = '不同意';
  function run(fn, verb){
    if(S.busy) return;
    S.busy = true; ok.disabled = no.disabled = true;
    fn(note.value.trim()).then(function(){ toast('已' + verb, 'success'); })
      .catch(function(e){ toast(e.message, 'error'); ok.disabled = no.disabled = false; })
      .then(function(){ S.busy = false; });
  }
  ok.onclick = function(){ run(onOk, '同意'); };
  no.onclick = function(){ if(confirm('確定駁回？')) run(onNo, '駁回'); };
  w.appendChild(note); w.appendChild(ok); w.appendChild(no);
  return w;
}
function badge(){
  var n = S.nL + S.nO, b = el('#bdAll');
  b.textContent = n; b.classList.toggle('hide', n === 0);
}

function renderLeaves(list){
  S.nL = list.length; el('#cL').textContent = list.length + ' 筆'; badge();
  var box = el('#lList');
  if(!list.length){ box.innerHTML = '<div class="empty">沒有待審的假單。</div>'; return; }
  box.innerHTML = '';
  list.forEach(function(r){
    var label = (r.type === 'other' && r.otherType) ? r.otherType : T.leaveTypeLabel(r.type);
    var d = document.createElement('div'); d.className = 'item';
    var h = '<div class="itop"><span class="inm">' + esc(r.name) + '</span>' +
      '<span class="ity">' + esc(label) + '</span>' +
      (r.isLate ? '<span class="flg">事後補請</span>' : '') +
      (r.segments && r.segments.length > 1 ? '<span class="flg">跨月</span>' : '') +
      '<span class="ih">' + r.hours + ' 小時</span></div>' +
      '<div class="im">' + T.fmtDateTime(r.startAt) + ' → ' + T.fmtDateTime(r.endAt) + '</div>';
    if(r.annualHours > 0) h += '<div class="inn">扣特休 ' + r.annualHours + ' 小時</div>';
    if(r.compHours > 0)   h += '<div class="inn">扣補休 ' + r.compHours + ' 小時</div>';
    if(r.segments && r.segments.length > 1)
      h += '<div class="inn">分月計入：' + r.segments.map(function(s){ return s.ym + ' ' + s.hours + 'h'; }).join('、') + '</div>';
    if(r.isLate && r.lateReason) h += '<div class="inn">補請原因：' + esc(r.lateReason) + '</div>';
    if(r.needsProxy) h += '<div class="inn">職務代理人：' + esc(r.proxyName || '未填') + '</div>';
    d.innerHTML = h;
    d.appendChild(actions(
      function(n){ return T.reviewLeave(r.id, T.STATUS.APPROVED, n); },
      function(n){ return T.reviewLeave(r.id, T.STATUS.REJECTED, n); }));
    box.appendChild(d);
  });
}

function renderOts(list){
  S.nO = list.length; el('#cO').textContent = list.length + ' 筆'; badge();
  var box = el('#oList');
  if(!list.length){ box.innerHTML = '<div class="empty">沒有待審的加班單。</div>'; return; }
  box.innerHTML = '';
  list.forEach(function(o){
    var d = document.createElement('div'); d.className = 'item';
    d.innerHTML = '<div class="itop"><span class="inm">' + esc(o.name) + '</span>' +
      '<span class="ity">加班</span>' +
      (o.overCapWarning ? '<span class="flg">本月已逾 46 小時</span>' : '') +
      '<span class="ih">' + o.hours + ' 小時</span></div>' +
      '<div class="im">' + T.fmtDate(o.date) + '　' +
        T.fmtDateTime(o.startAt).slice(-5) + ' – ' + T.fmtDateTime(o.endAt).slice(-5) + '</div>' +
      (o.reason ? '<div class="inn">事由：' + esc(o.reason) + '</div>' : '') +
      '<div class="bonus"><span>核派加班增額</span>' +
        '<input type="number" step="0.5" min="0" id="bn_' + o.id + '" value="' + (o.bonusHours || 0) + '">' +
        '<span>小時</span></div>';
    d.appendChild(actions(
      function(n){
        var b = parseFloat(el('#bn_' + o.id).value) || 0;
        var pre = (b !== (o.bonusHours || 0))
          ? T.setMerge(T.COL.overtime, o.id, { bonusHours: roundHalf(b) })
          : Promise.resolve();
        return pre.then(function(){ return T.reviewOvertime(o.id, T.STATUS.APPROVED, n); });
      },
      function(n){ return T.reviewOvertime(o.id, T.STATUS.REJECTED, n); }));
    box.appendChild(d);
  });
}

/* ---------- 人員 ---------- */
function toInput(v){
  if(!v) return '';
  var d = v.toDate ? v.toDate() : new Date(v);
  if(isNaN(d)) return '';
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function refreshUsers(){
  return T.listUsers().then(function(us){
    S.users = us;
    var box = el('#uList');
    if(!us.length){ box.innerHTML = '<div class="empty">還沒有人註冊。</div>'; return; }
    box.innerHTML = '';
    us.forEach(function(u){
      var d = document.createElement('div'); d.className = 'urow';
      d.innerHTML = '<div class="uhd"><b>' + esc(u.name || '（未填姓名）') + '</b>' +
        '<span class="uid">' + esc(u.loginId || '') + '</span>' +
        '<span class="st ' + (u.active === false ? 'off' : 'on') + '">' +
          (u.active === false ? '已停用' : '啟用中') + '</span></div>' +
        '<div class="ugrid"><select class="rs" data-uid="' + u.uid + '">' +
          Object.keys(T.ROLE_LABEL).map(function(r){
            return '<option value="' + r + '"' + (u.role === r ? ' selected' : '') + '>' + T.ROLE_LABEL[r] + '</option>';
          }).join('') + '</select>' +
        '<input type="date" class="hi" data-uid="' + u.uid + '" value="' + toInput(u.hireDate) + '"></div>' +
        '<button class="btn ghost sm tg" data-uid="' + u.uid + '" style="margin-top:9px">' +
          (u.active === false ? '啟用' : '停用') + '</button>';
      box.appendChild(d);
    });
    bindUsers();
    el('#aU').innerHTML = us.filter(function(u){ return u.role === T.ROLES.STAFF; })
      .map(function(u){ return '<option value="' + u.uid + '">' + esc(u.name || u.loginId) + '</option>'; }).join('');
  });
}
function bindUsers(){
  Array.prototype.forEach.call(document.querySelectorAll('.rs'), function(s){
    s.onchange = function(){
      T.upsertUser(s.dataset.uid, { role: s.value })
        .then(function(){ return T.writeAudit('user.role', s.dataset.uid, null, { role: s.value }); })
        .then(function(){ toast('身分已更新','success'); refreshUsers(); });
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.hi'), function(i){
    i.onchange = function(){
      T.upsertUser(i.dataset.uid, { hireDate: i.value ? new Date(i.value + 'T00:00:00') : null })
        .then(function(){ toast('到職日已更新','success'); });
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.tg'), function(b){
    b.onclick = function(){
      var u = null;
      S.users.forEach(function(x){ if(x.uid === b.dataset.uid) u = x; });
      T.upsertUser(u.uid, { active: u.active === false })
        .then(function(){ toast(u.active === false ? '已啟用' : '已停用','success'); refreshUsers(); });
    };
  });
}

/* ---------- 時數 ---------- */
function renderBal(){
  var staff = S.users.filter(function(u){ return u.role === T.ROLES.STAFF; });
  if(!staff.length){ el('#bList').innerHTML = '<div class="empty">還沒有秘書身分的人員。</div>'; return; }
  Promise.all(staff.map(function(u){
    return T.getBalance(u.uid).then(function(b){ return { u:u, b:b }; });
  })).then(function(rows){
    el('#bList').innerHTML = rows.map(function(r){
      return '<div class="urow"><div class="uhd"><b>' + esc(r.u.name || r.u.loginId) + '</b></div>' +
        '<div class="bgrid">' +
          '<div class="bx"><div class="k">特休剩餘</div><div class="v">' + (r.b.annualRemaining || 0) + '</div></div>' +
          '<div class="bx"><div class="k">補休剩餘</div><div class="v">' + (r.b.compRemaining || 0) + '</div></div>' +
          '<div class="bx"><div class="k">今年已用特休</div><div class="v">' + (r.b.annualUsedYTD || 0) + '</div></div>' +
          '<div class="bx"><div class="k">今年已用補休</div><div class="v">' + (r.b.compUsedYTD || 0) + '</div></div>' +
        '</div></div>';
    }).join('');
  });
}

el('#aB').onclick = function(){
  var uid = el('#aU').value, kind = el('#aK').value;
  var val = parseFloat(el('#aV').value), note = el('#aN').value.trim();
  if(!uid) return toast('請選對象','error');
  if(isNaN(val)) return toast('請填時數','error');
  if(!note) return toast('請填調整原因','error');
  var b = el('#aB'); b.disabled = true; b.textContent = '套用中…';
  T.getBalance(uid).then(function(before){
    var patch = {}; patch[kind] = roundHalf(val); patch.updatedAt = T.serverTimestamp();
    return T.setMerge(T.COL.balances, uid, patch).then(function(){
      var bf = {}; bf[kind] = before[kind] || 0;
      var af = {}; af[kind] = roundHalf(val); af.note = note;
      return T.writeAudit('balance.adjust', uid, bf, af);
    });
  }).then(function(){
    toast('已套用','success'); el('#aV').value=''; el('#aN').value=''; renderBal();
  }).catch(function(e){ toast(e.message,'error'); })
    .then(function(){ b.disabled=false; b.textContent='套用'; });
};

</script>
</body>
</html>
