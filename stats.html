<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>檢視台 — 請假加班系統</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0D14; --bg2:#0F141F; --card:#151C2B; --card2:#1C2436;
  --gold:#D9A93C; --gold-b:#F5D583; --line:rgba(217,169,60,.18);
  --txt:#EAEDF4; --dim:#8D96AC; --dim2:#5C6478;
  --ok:#4FBE81; --warn:#E5A83F; --bad:#E0605A;
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Noto Sans TC',system-ui,sans-serif;
  --halo:0 0 0 1px var(--line), 0 0 30px rgba(217,169,60,.10);
  --halo-hi:0 0 0 1px rgba(217,169,60,.5), 0 0 40px rgba(217,169,60,.25);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--txt);font-size:15px;line-height:1.6;min-height:100dvh;
  background:radial-gradient(800px 460px at 50% -8%,rgba(217,169,60,.11),transparent 62%),
             linear-gradient(180deg,var(--bg2),var(--bg));background-attachment:fixed;
  padding-bottom:env(safe-area-inset-bottom)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.3;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px)}
body>*{position:relative;z-index:2}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-weight:700;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hide{display:none!important}

.wrap{max-width:560px;margin:0 auto;padding:18px 16px 100px}
.gate{min-height:100dvh;display:grid;place-items:center;padding:22px}
.card{background:var(--card);border-radius:14px;box-shadow:var(--halo);margin-bottom:14px}
.card.glow{box-shadow:var(--halo-hi)}
.chd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.chd h2{font-size:14.5px;letter-spacing:.03em}
.unit{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--dim2)}
.cbd{padding:18px}

.brand{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--gold);margin-bottom:9px}
.sub{color:var(--dim);font-size:13px}

.field{margin-bottom:15px}
label.lb{display:block;font-size:12.5px;color:var(--dim);margin-bottom:6px}
.hint{font-size:12px;color:var(--dim2);margin-top:6px;line-height:1.5}
input,select,textarea{width:100%;padding:11px 13px;background:var(--bg);color:var(--txt);
  border:1px solid rgba(255,255,255,.09);border-radius:9px;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(217,169,60,.14)}
::placeholder{color:var(--dim2)}
textarea{min-height:70px;resize:vertical;font-size:15px}
input[type=date],input[type=time],input[type=number]{font-family:var(--mono)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{background:linear-gradient(145deg,var(--gold-b),var(--gold));color:#1C1305;border:none;
  border-radius:10px;padding:13px 22px;font-weight:700;cursor:pointer;font-size:15px;
  box-shadow:0 0 24px rgba(217,169,60,.28)}
.btn:active{transform:scale(.985)}
.btn:disabled{background:#2B3243;color:var(--dim2);box-shadow:none}
.btn.wide{width:100%}
.btn.sm{padding:8px 15px;font-size:13px;border-radius:8px}
.btn.ghost{background:none;color:var(--dim);box-shadow:0 0 0 1px rgba(255,255,255,.13)}
.btn.ghost:active{color:var(--gold)}
.btn.ok{background:linear-gradient(145deg,#6ED09A,var(--ok));color:#06210F;box-shadow:0 0 18px rgba(79,190,129,.3)}
.btn.no{background:none;color:var(--bad);box-shadow:0 0 0 1px rgba(224,96,90,.45)}

.err{background:rgba(224,96,90,.09);color:#F5928C;padding:11px 14px;border-radius:9px;
  font-size:13.5px;margin-bottom:15px;box-shadow:0 0 0 1px rgba(224,96,90,.3)}
.info{background:rgba(217,169,60,.07);color:var(--gold-b);padding:11px 14px;border-radius:9px;
  font-size:13px;margin-bottom:15px;box-shadow:0 0 0 1px var(--line)}
.empty{padding:38px 18px;text-align:center;color:var(--dim2);font-size:13.5px}

.tag{font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.tag.pending{background:rgba(229,168,63,.15);color:var(--warn)}
.tag.approved{background:rgba(79,190,129,.15);color:var(--ok)}
.tag.rejected{background:rgba(224,96,90,.15);color:var(--bad)}
.tag.cancelled{background:rgba(141,150,172,.13);color:var(--dim)}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:var(--card2);
  color:var(--txt);padding:12px 22px;border-radius:10px;font-size:14px;opacity:0;transition:.26s;
  z-index:99;box-shadow:var(--halo-hi);max-width:88vw;text-align:center}
.toast.is-in{opacity:1;transform:translate(-50%,0)}
.toast--error{color:#F5928C}
.toast--success{color:var(--ok)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}



/* --- 檢視台專屬 --- */
.wrap{max-width:720px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.tb{background:var(--card);border:none;border-radius:11px;padding:13px 8px;cursor:pointer;
  color:var(--dim);font-size:14px;font-weight:600;box-shadow:0 0 0 1px rgba(255,255,255,.05)}
.tb[aria-selected="true"]{color:var(--gold-b);box-shadow:var(--halo-hi)}
.ro{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim2);
  background:rgba(255,255,255,.04);padding:4px 11px;border-radius:20px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:14px 18px;
  border-bottom:1px solid var(--line)}
.filters select{font-size:14px;padding:9px 11px}
.filters .full{grid-column:1 / -1}
.item{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.05)}
.item:last-child{border-bottom:none}
.itop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.inm{font-weight:700;font-size:15px}
.ity{color:var(--gold-b);font-size:13.5px}
.ih{margin-left:auto;font-family:var(--mono);font-weight:700;color:var(--gold-b);font-size:14px}
.im{font-family:var(--mono);font-size:12px;color:var(--dim)}
.inn{font-size:12.5px;color:var(--dim);margin-top:4px}
.flg{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:700;
  background:rgba(229,168,63,.16);color:var(--warn)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:16px 18px}
.sx{background:var(--bg);border-radius:10px;padding:12px;text-align:center;
  box-shadow:0 0 0 1px rgba(255,255,255,.05)}
.sx .k{font-size:11px;color:var(--dim)}
.sx .v{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--gold-b);
  text-shadow:0 0 14px rgba(217,169,60,.4);line-height:1.25}
.tw{overflow-x:auto;padding:0 4px 4px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);color:var(--dim);
  font-weight:500;font-size:11.5px;white-space:nowrap;font-family:var(--mono)}
th:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
td{padding:10px;border-bottom:1px solid rgba(255,255,255,.05);text-align:right;
  font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--dim)}
td:first-child{text-align:left;font-family:var(--sans);color:var(--txt);font-weight:600;
  position:sticky;left:0;background:var(--card);white-space:nowrap}
td.hot{color:var(--gold-b);font-weight:600}
td.tot,th.tot{color:var(--gold-b)}
tr:last-child td{border-bottom:none}
.gsec{padding:14px 18px 4px;font-size:12.5px;color:var(--dim);letter-spacing:.05em}
</style>
</head>
<body>

<section id="gate" class="gate">
  <div style="width:100%;max-width:360px">
    <div class="card"><div class="cbd" style="padding:32px 26px">
      <div class="brand">TPS · 檢視台</div>
      <h1 style="font-size:20px">請假加班檢視</h1>
      <p class="sub" style="margin:6px 0 22px">輸入檢視密碼。這個頁面只能看，不能修改任何資料。</p>
      <div id="gErr" class="err hide"></div>
      <div class="field"><input type="password" id="gpw" placeholder="密碼"></div>
      <button class="btn wide" id="gBtn">進入</button>
    </div></div>
  </div>
</section>

<div id="app" class="hide"><div class="wrap">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
    <div><div class="brand" style="margin:0">TPS · 檢視台</div>
      <div style="font-size:17px;font-weight:700">請假加班檢視</div></div>
    <button class="btn ghost sm" id="outBtn" style="margin-left:auto">離開</button>
  </div>
  <div style="margin-bottom:14px"><span class="ro">🔒 唯讀檢視　無修改權限</span></div>

  <div class="tabs">
    <button class="tb" data-p="lv" aria-selected="true">請假紀錄</button>
    <button class="tb" data-p="ot" aria-selected="false">加班紀錄</button>
    <button class="tb" data-p="yr" aria-selected="false">年度統計</button>
  </div>

  <section class="card">
    <div class="filters">
      <select id="fYear"></select>
      <select id="fMonth"><option value="">全年</option></select>
      <select id="fUser" class="full"><option value="">全部人員</option></select>
      <select id="fStat" class="full">
        <option value="">全部狀態</option>
        <option value="approved">只看已核准</option>
        <option value="pending">只看待審核</option>
        <option value="rejected">只看不同意</option>
        <option value="cancelled">只看已撤銷</option>
      </select>
    </div>
    <div class="sum">
      <div class="sx"><div class="k" id="k1">請假總時數</div><div class="v num" id="v1">0</div></div>
      <div class="sx"><div class="k">待審核</div><div class="v num" id="v2">0</div></div>
      <div class="sx"><div class="k">筆數</div><div class="v num" id="v3">0</div></div>
    </div>
    <div id="list"><div class="empty">載入中…</div></div>
  </section>

  <div id="pYr" class="hide">
    <section class="card">
      <div class="chd"><h2>請假時數（已核准）</h2><span class="unit">小時</span></div>
      <div class="gsec">跨月的假單已依工作日自動分月計入。</div>
      <div class="tw"><table id="tLeave"></table></div>
    </section>
    <section class="card">
      <div class="chd"><h2>加班時數（已核准）</h2><span class="unit">含核派增額</span></div>
      <div class="tw"><table id="tOt"></table></div>
    </section>
  </div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="shared.js?v=2.1.0"></script>
<script>

var T = window.TPS;
var el = T.el, esc = T.esc, toast = T.toast, roundHalf = T.roundHalf;
var S = { tab:'lv', year:new Date().getFullYear(), leaves:[], ots:[], users:[], loaded:{} };

function showErr(id,msg){ var b=el('#'+id); if(!msg){b.classList.add('hide');return;} b.textContent=msg; b.classList.remove('hide'); }

/* ---------- 進入 ---------- */
el('#gBtn').onclick = function(){
  showErr('gErr','');
  if(!T.viewerLogin(el('#gpw').value)) return showErr('gErr','密碼不正確。');
  el('#gate').classList.add('hide'); el('#app').classList.remove('hide');
  boot();
};
el('#gpw').addEventListener('keydown', function(e){ if(e.key==='Enter') el('#gBtn').click(); });
el('#outBtn').onclick = function(){
  T.viewerLogout();
  el('#app').classList.add('hide'); el('#gate').classList.remove('hide');
  el('#gpw').value = '';
};

/* ---------- 初始化 ---------- */
function boot(){
  var now = new Date().getFullYear(), opts = '';
  for(var y = now + 1; y >= 2024; y--) opts += '<option value="' + y + '">' + y + ' 年</option>';
  el('#fYear').innerHTML = opts;
  el('#fYear').value = S.year;

  var m = '<option value="">全年</option>';
  for(var i = 1; i <= 12; i++) m += '<option value="' + i + '">' + i + ' 月</option>';
  el('#fMonth').innerHTML = m;

  T.listUsers().then(function(us){
    S.users = us;
    el('#fUser').innerHTML = '<option value="">全部人員</option>' + us.map(function(u){
      return '<option value="' + u.uid + '">' + esc(u.name || u.loginId) + '</option>';
    }).join('');
  });

  load();
}

function load(){
  var y = S.year;
  el('#list').innerHTML = '<div class="empty">載入中…</div>';
  Promise.all([T.fetchLeavesByYear(y), T.fetchOvertimeByYear(y)]).then(function(r){
    S.leaves = r[0]; S.ots = r[1];
    render();
    if(S.tab === 'yr') renderYear();
  }).catch(function(e){
    el('#list').innerHTML = '<div class="empty">載入失敗：' + esc(e.message) + '</div>';
  });
}

/* ---------- 分頁 ---------- */
Array.prototype.forEach.call(document.querySelectorAll('.tb'), function(t){
  t.onclick = function(){
    Array.prototype.forEach.call(document.querySelectorAll('.tb'), function(x){
      x.setAttribute('aria-selected', x === t);
    });
    S.tab = t.dataset.p;
    el('#pYr').classList.toggle('hide', S.tab !== 'yr');
    document.querySelector('.card').classList.toggle('hide', S.tab === 'yr');
    if(S.tab === 'yr') renderYear(); else render();
  };
});

['#fYear','#fMonth','#fUser','#fStat'].forEach(function(i){
  el(i).onchange = function(){
    if(i === '#fYear'){ S.year = parseInt(el('#fYear').value); load(); }
    else render();
  };
});

/* ---------- 清單 ---------- */
function pass(r, dateField){
  var mo = el('#fMonth').value, uid = el('#fUser').value, st = el('#fStat').value;
  if(uid && r.uid !== uid) return false;
  if(st && r.status !== st) return false;
  if(mo){
    var d = T.toDate(r[dateField]);
    if((d.getMonth() + 1) !== parseInt(mo)) return false;
  }
  return true;
}

function render(){
  var isLeave = S.tab === 'lv';
  var src = isLeave ? S.leaves : S.ots;
  var list = src.filter(function(r){ return pass(r, isLeave ? 'startAt' : 'date'); });

  el('#k1').textContent = isLeave ? '請假總時數' : '加班總時數';
  var sum = 0, pend = 0;
  list.forEach(function(r){
    if(r.status === T.STATUS.APPROVED) sum = roundHalf(sum + (r.hours || 0));
    if(r.status === T.STATUS.PENDING) pend++;
  });
  el('#v1').textContent = sum;
  el('#v2').textContent = pend;
  el('#v3').textContent = list.length;

  var box = el('#list');
  if(!list.length){ box.innerHTML = '<div class="empty">這個範圍沒有紀錄。</div>'; return; }

  // 新的排前面
  list.sort(function(a, b){
    return T.toDate(b[isLeave ? 'startAt' : 'date']) - T.toDate(a[isLeave ? 'startAt' : 'date']);
  });

  box.innerHTML = list.map(function(r){
    if(isLeave){
      var label = (r.type === 'other' && r.otherType) ? r.otherType : T.leaveTypeLabel(r.type);
      var h = '<div class="item"><div class="itop">' +
        '<span class="inm">' + esc(r.name) + '</span>' +
        '<span class="ity">' + esc(label) + '</span>' +
        (r.isLate ? '<span class="flg">事後補請</span>' : '') +
        '<span class="tag ' + r.status + '">' + T.STATUS_LABEL[r.status] + '</span>' +
        '<span class="ih">' + r.hours + ' 小時</span></div>' +
        '<div class="im">' + T.fmtDateTime(r.startAt) + ' → ' + T.fmtDateTime(r.endAt) + '</div>';
      if(r.segments && r.segments.length > 1)
        h += '<div class="inn">跨月：' + r.segments.map(function(s){ return s.ym + ' ' + s.hours + 'h'; }).join('、') + '</div>';
      if(r.needsProxy) h += '<div class="inn">職務代理人：' + esc(r.proxyName || '未填') + '</div>';
      if(r.reviewedBy) h += '<div class="inn">審核：' + esc(r.reviewedBy) +
        (r.reviewedAt ? '　' + T.fmtDate(r.reviewedAt) : '') + '</div>';
      if(r.adminNote) h += '<div class="inn">註記：' + esc(r.adminNote) + '</div>';
      return h + '</div>';
    }
    var o = '<div class="item"><div class="itop">' +
      '<span class="inm">' + esc(r.name) + '</span>' +
      '<span class="ity">加班</span>' +
      (r.overCapWarning ? '<span class="flg">本月逾 46 小時</span>' : '') +
      '<span class="tag ' + r.status + '">' + T.STATUS_LABEL[r.status] + '</span>' +
      '<span class="ih">' + r.hours + ' 小時</span></div>' +
      '<div class="im">' + T.fmtDate(r.date) + '　' +
        T.fmtDateTime(r.startAt).slice(-5) + ' – ' + T.fmtDateTime(r.endAt).slice(-5) + '</div>';
    if(r.bonusHours > 0) o += '<div class="inn">核派增額 +' + r.bonusHours + ' 小時</div>';
    if(r.reason) o += '<div class="inn">事由：' + esc(r.reason) + '</div>';
    if(r.reviewedBy) o += '<div class="inn">審核：' + esc(r.reviewedBy) + '</div>';
    if(r.adminNote) o += '<div class="inn">註記：' + esc(r.adminNote) + '</div>';
    return o + '</div>';
  }).join('');
}

/* ---------- 年度統計 ---------- */
function renderYear(){
  el('#tLeave').innerHTML = '<tr><td>載入中…</td></tr>';
  T.buildYearMatrix(S.year).then(function(M){
    var mHead = M.months.map(function(m){ return '<th>' + parseInt(m.slice(5)) + '月</th>'; }).join('');
    var active = M.users.filter(function(u){
      var L = M.leave[u.uid], O = M.overtime[u.uid];
      return (L && L.total > 0) || (O && O.total > 0);
    });
    if(!active.length){
      el('#tLeave').innerHTML = '<tr><td>' + S.year + ' 年沒有已核准的紀錄。</td></tr>';
      el('#tOt').innerHTML = '';
      return;
    }

    // 請假：每人一列，值為當月所有假別加總
    var rows = active.map(function(u){
      var L = M.leave[u.uid];
      var cells = M.months.map(function(m){
        var v = 0;
        T.LEAVE_TYPES.forEach(function(t){ v = roundHalf(v + ((L[t.id] && L[t.id][m]) || 0)); });
        return '<td' + (v > 0 ? ' class="hot"' : '') + '>' + (v || '·') + '</td>';
      }).join('');
      return '<tr><td>' + esc(u.name || u.loginId) + '</td>' + cells +
             '<td class="tot">' + (L.total || 0) + '</td></tr>';
    }).join('');
    el('#tLeave').innerHTML = '<thead><tr><th>姓名</th>' + mHead +
      '<th class="tot">合計</th></tr></thead><tbody>' + rows + '</tbody>';

    var oRows = active.map(function(u){
      var O = M.overtime[u.uid];
      var cells = M.months.map(function(m){
        var v = O.withBonus[m] || 0;
        return '<td' + (v > 0 ? ' class="hot"' : '') + '>' + (v || '·') + '</td>';
      }).join('');
      return '<tr><td>' + esc(u.name || u.loginId) + '</td>' + cells +
             '<td class="tot">' + (O.total || 0) + '</td></tr>';
    }).join('');
    el('#tOt').innerHTML = '<thead><tr><th>姓名</th>' + mHead +
      '<th class="tot">合計</th></tr></thead><tbody>' + oRows + '</tbody>';
  }).catch(function(e){
    el('#tLeave').innerHTML = '<tr><td>載入失敗：' + esc(e.message) + '</td></tr>';
  });
}

</script>
</body>
</html>
