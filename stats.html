<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>請假狀況檢視 — 台灣物理學會行政室</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0D14; --bg2:#0F141F; --card:#151C2B; --card2:#1C2436;
  --gold:#D9A93C; --gold-b:#F5D583; --line:rgba(217,169,60,.18);
  --txt:#EAEDF4; --dim:#8D96AC; --dim2:#5C6478;
  --ok:#4FBE81; --warn:#E5A83F; --bad:#E0605A;
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Noto Sans TC',system-ui,sans-serif;
  --halo:0 0 0 1px var(--line), 0 0 30px rgba(217,169,60,.10);
  --halo-hi:0 0 0 1px rgba(217,169,60,.5), 0 0 40px rgba(217,169,60,.25);
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
  --sl:env(safe-area-inset-left); --sr:env(safe-area-inset-right);
}
*{box-sizing:border-box;margin:0;padding:0;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{font-family:var(--sans);color:var(--txt);font-size:15px;line-height:1.6;
  min-height:100dvh;overscroll-behavior-y:none;
  background:radial-gradient(800px 460px at 50% -8%,rgba(217,169,60,.11),transparent 62%),
             linear-gradient(180deg,var(--bg2),var(--bg));background-attachment:fixed}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.3;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px)}
body>*{position:relative;z-index:2}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-weight:700;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hide{display:none!important}

input,select,textarea{width:100%;max-width:100%;font-size:16px;padding:12px 13px;
  background:var(--bg);color:var(--txt);border:1px solid rgba(255,255,255,.09);
  border-radius:10px;-webkit-appearance:none;appearance:none;background-clip:padding-box}
input[type=date],input[type=time]{min-height:48px;display:block;text-align:left;font-family:var(--mono)}
input[type=checkbox]{width:19px;min-height:0;-webkit-appearance:auto;appearance:auto;padding:0}
select{background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
  linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea{min-height:78px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;
  box-shadow:0 0 0 3px rgba(217,169,60,.14)}
::placeholder{color:var(--dim2)}

.card{background:var(--card);border-radius:14px;box-shadow:var(--halo);margin-bottom:14px}
.chd{padding:14px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.chd h2{font-size:14.5px;letter-spacing:.03em}
.unit{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  color:var(--dim2);white-space:nowrap;flex:none}
.cbd{padding:17px}
.field{margin-bottom:15px}
.field:last-child{margin-bottom:0}
label.lb{display:block;font-size:12.5px;color:var(--dim);margin-bottom:7px}
.hint{font-size:12px;color:var(--dim2);margin-top:7px;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{background:linear-gradient(145deg,var(--gold-b),var(--gold));color:#1C1305;border:none;
  border-radius:11px;padding:14px 22px;font-weight:700;cursor:pointer;font-size:15px;
  box-shadow:0 0 24px rgba(217,169,60,.26);width:100%}
.btn:active{transform:scale(.985)}
.btn:disabled{background:#2B3243;color:var(--dim2);box-shadow:none}
.btn.sm{padding:9px 15px;font-size:13.5px;border-radius:9px;width:auto}
.btn.ghost{background:none;color:var(--dim);box-shadow:0 0 0 1px rgba(255,255,255,.13)}
.btn.ghost:active{color:var(--gold)}
.btn.ok{background:linear-gradient(145deg,#6ED09A,var(--ok));color:#06210F;
  box-shadow:0 0 18px rgba(79,190,129,.28)}
.btn.no{background:none;color:var(--bad);box-shadow:0 0 0 1px rgba(224,96,90,.45)}

.err{background:rgba(224,96,90,.09);color:#F5928C;padding:12px 14px;border-radius:10px;
  font-size:13.5px;margin-bottom:15px;box-shadow:0 0 0 1px rgba(224,96,90,.3)}
.info{background:rgba(217,169,60,.07);color:var(--gold-b);padding:12px 14px;border-radius:10px;
  font-size:13px;line-height:1.7;margin-bottom:15px;box-shadow:0 0 0 1px var(--line)}
.empty{padding:40px 18px;text-align:center;color:var(--dim2);font-size:13.5px}
.tag{font-size:10.5px;padding:3px 10px;border-radius:20px;font-weight:700;
  letter-spacing:.04em;white-space:nowrap;flex:none}
.tag.pending{background:rgba(229,168,63,.15);color:var(--warn)}
.tag.approved{background:rgba(79,190,129,.15);color:var(--ok)}
.tag.rejected{background:rgba(224,96,90,.15);color:var(--bad)}
.tag.cancelled{background:rgba(141,150,172,.13);color:var(--dim)}

.toast{position:fixed;left:50%;bottom:calc(26px + var(--sb));transform:translate(-50%,16px);
  background:var(--card2);color:var(--txt);padding:13px 22px;border-radius:11px;font-size:14px;
  opacity:0;transition:.26s;z-index:200;box-shadow:var(--halo-hi);max-width:88vw;text-align:center}
.toast.is-in{opacity:1;transform:translate(-50%,0)}
.toast--error{color:#F5928C}
.toast--success{color:var(--ok)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}


/* ===== 報表版：寬版、留白大、數字大 ===== */
body{font-size:15px}
#gate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:center;
  padding:calc(28px + var(--st)) calc(24px + var(--sr)) calc(28px + var(--sb)) calc(24px + var(--sl));
  background:radial-gradient(760px 440px at 50% 6%,rgba(217,169,60,.13),transparent 62%),
             linear-gradient(180deg,var(--bg2),var(--bg))}
.gate-in{width:100%;max-width:380px;margin:0 auto}
.brand{font-family:var(--mono);font-size:11px;letter-spacing:.32em;color:var(--gold);margin-bottom:10px}
#gate h1{font-size:26px;letter-spacing:.01em}
.gsub{color:var(--dim);font-size:13.5px;margin:8px 0 30px;line-height:1.8}

.top{position:sticky;top:0;z-index:20;background:rgba(10,13,20,.9);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding-top:var(--st)}
.tin{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:16px;
  padding:15px calc(26px + var(--sr)) 15px calc(26px + var(--sl))}
.tin .sub{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--gold)}
.tin .ttl{font-size:18px;font-weight:700;letter-spacing:.02em}
.lock{margin-left:auto;background:none;border:none;cursor:pointer;color:var(--dim);
  font-size:12.5px;padding:9px 15px;border-radius:9px;box-shadow:0 0 0 1px rgba(255,255,255,.1);
  display:flex;align-items:center;gap:7px;width:auto}
.lock.on{color:var(--gold-b);box-shadow:0 0 0 1px rgba(217,169,60,.45)}

.nav{max-width:1060px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;
  padding:20px calc(26px + var(--sr)) 0 calc(26px + var(--sl))}
.nav button{background:var(--card);border:none;border-radius:11px;padding:11px 20px;cursor:pointer;
  color:var(--dim);font-size:14px;font-weight:600;box-shadow:0 0 0 1px rgba(255,255,255,.05);width:auto}
.nav button[aria-selected="true"]{color:var(--gold-b);box-shadow:var(--halo-hi)}
main{max-width:1060px;margin:0 auto;
  padding:20px calc(26px + var(--sr)) calc(70px + var(--sb)) calc(26px + var(--sl))}

.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:760px){ .hero{grid-template-columns:repeat(2,1fr)} }
.hcell{background:var(--card);border-radius:14px;padding:20px;box-shadow:var(--halo)}
.hcell .k{font-size:12px;color:var(--dim);letter-spacing:.05em;margin-bottom:6px}
.hcell .v{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--gold-b);
  text-shadow:0 0 20px rgba(217,169,60,.35);line-height:1.25}
.hcell .v small{font-size:12px;color:var(--dim2);font-weight:400;margin-left:5px;text-shadow:none}
.hcell .s{font-size:11.5px;color:var(--dim2);margin-top:4px}

.card{background:var(--card);border-radius:16px;box-shadow:var(--halo);margin-bottom:20px}
.chd{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:14px;flex-wrap:wrap}
.chd h2{font-size:17px;letter-spacing:.02em}
.chd .note{font-size:12px;color:var(--dim2);width:100%;line-height:1.6}
.chd .sp{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
.chd select{width:auto;min-width:110px;padding:9px 32px 9px 12px;font-size:14px}
.cbd{padding:24px}

/* 月曆 */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.mgrid .wd{text-align:center;font-size:11px;color:var(--dim2);padding:6px 0;font-family:var(--mono)}
.day{aspect-ratio:1;border-radius:10px;background:var(--bg);padding:8px;position:relative;
  box-shadow:0 0 0 1px rgba(255,255,255,.04);display:flex;flex-direction:column;gap:3px;overflow:hidden}
.day.pad{background:none;box-shadow:none;opacity:.2}
.day .n{font-family:var(--mono);font-size:12.5px;color:var(--dim)}
.day.off .n{color:var(--dim2)}
.day.hol{background:rgba(224,96,90,.07)} .day.hol .n{color:#F5928C}
.day.wkd{background:rgba(79,190,129,.07)} .day.wkd .n{color:var(--ok)}
.day.today{box-shadow:0 0 0 1.5px var(--gold)}
.pill{font-size:10px;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;font-weight:600;line-height:1.5}
.pill.approved{background:rgba(79,190,129,.2);color:#8FE0B2}
.pill.pending{background:rgba(229,168,63,.2);color:#F0C878}
.pill.rejected{background:rgba(224,96,90,.18);color:#F5928C;text-decoration:line-through}
.pill.cancelled{background:rgba(141,150,172,.15);color:var(--dim2);text-decoration:line-through}
@media(max-width:700px){ .day{aspect-ratio:auto;min-height:74px} .day .n{font-size:11.5px} }

/* 申請清單 */
.appl{padding:16px 24px;border-bottom:1px solid rgba(255,255,255,.05);display:flex;
  align-items:center;gap:16px;flex-wrap:wrap}
.appl:last-child{border-bottom:none}
.appl .who{font-weight:700;font-size:15.5px;min-width:80px}
.appl .rng{font-family:var(--mono);font-size:13.5px;color:var(--txt)}
.appl .tl{font-family:var(--mono);font-size:11.5px;color:var(--dim2);width:100%;line-height:1.8}
.appl .st{margin-left:auto}

/* 表格 */
.tw{overflow-x:auto;padding:0 6px 6px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:660px}
th{text-align:right;padding:12px 10px;color:var(--dim);font-weight:500;font-size:11.5px;
  white-space:nowrap;font-family:var(--mono);border-bottom:1px solid var(--line)}
th:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:2}
td{padding:12px 10px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;
  color:var(--dim);border-bottom:1px solid rgba(255,255,255,.04)}
td:first-child{text-align:left;font-family:var(--sans);color:var(--txt);font-weight:600;
  white-space:nowrap;position:sticky;left:0;background:var(--card);z-index:1}
tr:last-child td{border-bottom:none}
td.tot,th.tot{color:var(--gold-b);font-weight:700}
td .cellv{display:inline-block;min-width:34px;padding:5px 8px;border-radius:7px}

/* 長條圖 */
.bars{display:flex;align-items:flex-end;gap:8px;height:190px;padding:20px 24px 0}
.barw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;height:100%}
.barw .bv{font-family:var(--mono);font-size:11px;color:var(--gold-b)}
.barw .bb{width:100%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--gold-b),var(--gold));
  box-shadow:0 0 16px rgba(217,169,60,.28);min-height:2px;transition:height .4s}
.barw.b2 .bb{background:linear-gradient(180deg,#7DD6A6,#3E9E68);box-shadow:0 0 16px rgba(79,190,129,.25)}
.blabels{display:flex;gap:8px;padding:9px 24px 20px}
.blabels div{flex:1;text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--dim2)}
.legend{display:flex;gap:18px;padding:0 24px 18px;font-size:12px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:11px;height:11px;border-radius:3px;display:block}

/* 明細（第二層） */
.rec{padding:17px 24px;border-bottom:1px solid rgba(255,255,255,.05)}
.rec:last-child{border-bottom:none}
.rtop{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:5px}
.rtop .nm{font-weight:700;font-size:15.5px}
.rtop .ty{color:var(--gold-b);font-size:14px}
.rtop .hr{margin-left:auto;font-family:var(--mono);font-weight:700;color:var(--gold-b);font-size:15px}
.rmeta{font-family:var(--mono);font-size:12.5px;color:var(--dim);line-height:1.7}
.rtrail{margin-top:9px;padding-top:9px;border-top:1px dashed rgba(255,255,255,.07);
  font-size:11.5px;color:var(--dim2);line-height:1.9}
.rtrail b{font-family:var(--mono);color:var(--dim)}
.rbtns{display:flex;gap:9px;margin-top:12px}
.rbtns .btn{width:auto;padding:8px 16px;font-size:13px}
.termtag{font-size:10.5px;padding:2px 9px;border-radius:20px;font-weight:700;
  background:rgba(141,150,172,.14);color:var(--dim)}
.imported{font-size:10.5px;padding:2px 9px;border-radius:20px;font-weight:700;
  background:rgba(141,150,172,.12);color:var(--dim2)}

/* 編輯面板 */
.edit{background:var(--bg);border-radius:12px;padding:18px;margin-top:14px;
  box-shadow:0 0 0 1px var(--line)}
.egrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){ .egrid{grid-template-columns:1fr} }
.egrid label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
.efoot{display:flex;gap:10px;margin-top:14px}
.efoot .btn{width:auto;padding:11px 20px;font-size:14px}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;padding:20px 24px;
  border-bottom:1px solid var(--line)}
@media(max-width:760px){ .filters{grid-template-columns:1fr 1fr} }

</style>
</head>
<body>
<section id="gate">
  <div class="gate-in">
    <div class="brand">TPS · 行政室</div>
    <h1>請假狀況檢視</h1>
    <p class="gsub">社團法人台灣物理學會<br>查看行政室同仁的請假申請與核准狀況。</p>
    <div id="gErr" class="err hide"></div>
    <div class="field"><input type="password" id="gPw" placeholder="檢視密碼"></div>
    <button class="btn" id="gBtn">進入</button>
  </div>
</section>

<div id="app" class="hide">
<header class="top"><div class="tin">
  <div><div class="sub">TPS · 行政室</div><div class="ttl">請假狀況檢視</div></div>
  <button class="lock" id="lockBtn"><span id="lockIc">🔒</span><span id="lockTx">完整資料</span></button>
</div></header>

<div class="nav" id="nav">
  <button data-p="Cal" aria-selected="true">請假月曆</button>
  <button data-p="Sum" aria-selected="false" class="lv2 hide">年度總表</button>
  <button data-p="Bal" aria-selected="false" class="lv2 hide">目前時數</button>
  <button data-p="Det" aria-selected="false" class="lv2 hide">明細</button>
</div>

<main>
  <!-- 第一層：月曆 -->
  <div id="pCal">
    <div class="card">
      <div class="chd">
        <h2 id="calTitle">—</h2>
        <div class="sp">
          <button class="btn ghost" id="mPrev" style="width:auto;padding:9px 16px">上個月</button>
          <button class="btn ghost" id="mNext" style="width:auto;padding:9px 16px">下個月</button>
        </div>
      </div>
      <div class="cbd">
        <div class="mgrid" id="wdHead"></div>
        <div class="mgrid" id="mBody"></div>
        <div class="legend" style="padding:18px 0 0">
          <span><i style="background:#4FBE81"></i>已同意</span>
          <span><i style="background:#E5A83F"></i>待審核</span>
          <span><i style="background:#E0605A"></i>不同意</span>
          <span><i style="background:#5C6478"></i>已撤銷</span>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="chd"><h2>本月申請</h2><span class="unit" id="applCnt"></span></div>
      <div id="applList"><div class="empty">這個月沒有請假申請。</div></div>
    </div>
  </div>

  <!-- 第二層 -->
  <div id="pSum" class="hide">
    <div class="hero" id="sumHero"></div>
    <div class="card">
      <div class="chd"><h2>請假時數</h2>
        <div class="sp"><select id="sumYear"></select></div>
        <div class="note">跨月的假單已依工作日自動分月計入。顏色越深代表時數越多。</div>
      </div>
      <div class="tw"><table id="tLeave"></table></div>
    </div>
    <div class="card">
      <div class="chd"><h2>加班時數</h2><div class="note">含核派加班加倍後的時數。</div></div>
      <div class="tw"><table id="tOt"></table></div>
    </div>
    <div class="card">
      <div class="chd"><h2>每月趨勢</h2><div class="note" id="trendNote"></div></div>
      <div class="bars" id="bars"></div>
      <div class="blabels" id="blabels"></div>
      <div class="legend">
        <span><i style="background:#D9A93C"></i>請假</span>
        <span><i style="background:#4FBE81"></i>加班</span>
      </div>
    </div>
  </div>

  <div id="pBal" class="hide">
    <div class="card">
      <div class="chd"><h2>目前時數</h2>
        <div class="note">特休與補休都分「去年遞延」和「今年」兩部分，請假時優先扣遞延的。</div>
      </div>
      <div class="tw"><table id="tBal"></table></div>
    </div>
  </div>

  <div id="pDet" class="hide">
    <div class="card">
      <div class="filters">
        <select id="fWho"><option value="">全部人員</option></select>
        <select id="fKind"><option value="">請假＋加班</option>
          <option value="leave">只看請假</option><option value="overtime">只看加班</option></select>
        <select id="fStat"><option value="">全部狀態</option>
          <option value="pending">待審核</option><option value="approved">同意</option>
          <option value="rejected">不同意</option><option value="cancelled">已撤銷</option></select>
        <select id="fRange">
          <option value="m">本月</option><option value="y" selected>今年</option>
          <option value="ly">去年</option><option value="all">全部</option></select>
      </div>
      <div class="chd" style="border-top:none"><h2>明細</h2><span class="unit" id="detCnt">—</span>
        <div class="note">可以直接修改或刪除。改動時數或狀態時，系統會自動把餘額調整正確。</div>
      </div>
      <div id="detList"><div class="empty">載入中…</div></div>
    </div>
  </div>
</main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
<script>
if(!window.TPS){
  document.body.innerHTML =
    '<div style="padding:70px 26px;text-align:center;font-family:system-ui;color:#EAEDF4">' +
    '<div style="font-size:44px">🔄</div><h2 style="margin:12px 0 8px">需要重新載入</h2>' +

var T = window.TPS, el = T.el, esc = T.esc, toast = T.toast, roundHalf = T.roundHalf;
T.setErrorHandler(function(e){ toast('讀取失敗：' + (e.message || e), 'error'); });

var LV2_KEY = 'tps.stats.lv2';
var S = { page:'Cal', lv2:false, y:new Date().getFullYear(), m:new Date().getMonth(),
          accounts:[], leaves:[], ots:[], loaded:false };

function showErr(id,msg){ var b=el('#'+id);
  if(!msg){ b.classList.add('hide'); return; } b.textContent=msg; b.classList.remove('hide'); }

/* ---------- 第一層 ---------- */
el('#gBtn').onclick = function(){
  showErr('gErr','');
  var pw = el('#gPw').value;
  if(pw !== 'physics'){
    // 直接輸入第二層密碼也能進，一次到位
    if(pw === T.ADMIN_PASSWORD){ unlock(true); enter(); return; }
    return showErr('gErr','密碼不正確。');
  }
  enter();
};
el('#gPw').addEventListener('keydown', function(e){ if(e.key==='Enter') el('#gBtn').click(); });

function enter(){
  T.viewerLogin ? null : null;
  el('#gate').classList.add('hide');
  el('#app').classList.remove('hide');
  try { if(localStorage.getItem(LV2_KEY) === '1') unlock(true); } catch(e){}
  loadAll();
}

/* ---------- 第二層解鎖 ---------- */
function unlock(on){
  S.lv2 = on;
  el('#lockIc').textContent = on ? '🔓' : '🔒';
  el('#lockTx').textContent = on ? '完整資料（已解鎖）' : '完整資料';
  el('#lockBtn').classList.toggle('on', on);
  Array.prototype.forEach.call(document.querySelectorAll('.lv2'), function(b){
    b.classList.toggle('hide', !on);
  });
  try { on ? localStorage.setItem(LV2_KEY,'1') : localStorage.removeItem(LV2_KEY); } catch(e){}
  if(!on && S.page !== 'Cal') go('Cal');
  if(on) T.adminLogin(T.ADMIN_PASSWORD);   // 解鎖後才有修改權限
  else T.adminLogout();
}
el('#lockBtn').onclick = function(){
  if(S.lv2){
    if(!confirm('鎖回去？之後要看完整資料需要再輸入一次密碼。')) return;
    unlock(false); return;
  }
  var pw = prompt('輸入完整資料的密碼');
  if(pw === null) return;
  if(pw !== T.ADMIN_PASSWORD) return toast('密碼不正確','error');
  unlock(true);
  toast('已解鎖完整資料','success');
  renderAll();
};

/* ---------- 分頁 ---------- */
function go(p){
  S.page = p;
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function(b){
    b.setAttribute('aria-selected', b.dataset.p === p);
  });
  ['Cal','Sum','Bal','Det'].forEach(function(x){
    el('#p'+x).classList.toggle('hide', x !== p);
  });
  window.scrollTo(0,0);
  if(p === 'Sum') renderSummary();
  if(p === 'Bal') renderBalances();
  if(p === 'Det') renderDetail();
}
Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function(b){
  b.onclick = function(){ go(b.dataset.p); };
});

/* ---------- 載入 ---------- */
function loadAll(){
  return Promise.all([
    T.listAccounts(),
    T.loadCalendar(),
    T.db.collection(T.COL.leave).get(),
    T.db.collection(T.COL.overtime).get()
  ]).then(function(r){
    S.accounts = r[0];
    S.leaves = snap(r[2]); S.ots = snap(r[3]);
    S.loaded = true;
    var opts = '<option value="">全部人員</option>' + S.accounts.map(function(a){
      return '<option value="' + esc(a.email) + '">' + esc(a.name || a.email) + '</option>'; }).join('');
    el('#fWho').innerHTML = opts;
    var yrs = {}; S.leaves.concat(S.ots).forEach(function(x){
      var d = T.toDate(x.startAt || x.date); if(!isNaN(d)) yrs[d.getFullYear()] = 1; });
    yrs[new Date().getFullYear()] = 1;
    el('#sumYear').innerHTML = Object.keys(yrs).sort().reverse()
      .map(function(y){ return '<option value="' + y + '">' + y + ' 年</option>'; }).join('');
    el('#sumYear').value = new Date().getFullYear();
    el('#sumYear').onchange = renderSummary;
    renderAll();
  }).catch(function(e){ toast('載入失敗：' + e.message, 'error'); });
}
function snap(s){ var o=[]; s.forEach(function(d){ var x=d.data(); x.id=d.id; o.push(x); }); return o; }
function renderAll(){ renderCal(); if(S.page!=='Cal') go(S.page); }

/* ---------- 月曆（第一層看得到的全部） ---------- */
var WD = ['日','一','二','三','四','五','六'];
el('#wdHead').innerHTML = WD.map(function(w){ return '<div class="wd">' + w + '</div>'; }).join('');
el('#mPrev').onclick = function(){ S.m--; if(S.m<0){S.m=11;S.y--;} renderCal(); };
el('#mNext').onclick = function(){ S.m++; if(S.m>11){S.m=0;S.y++;} renderCal(); };

function inMonth(x, y, m){
  var s = T.toDate(x.startAt), e = T.toDate(x.endAt);
  var a = new Date(y, m, 1), b = new Date(y, m+1, 0, 23, 59, 59);
  return s <= b && e >= a;
}
function pad2(n){ return String(n).padStart(2,'0'); }

function renderCal(){
  el('#calTitle').textContent = S.y + ' 年 ' + (S.m + 1) + ' 月';
  var list = S.leaves.filter(function(x){ return inMonth(x, S.y, S.m); });

  var first = new Date(S.y, S.m, 1).getDay();
  var days  = new Date(S.y, S.m+1, 0).getDate();
  var today = new Date();
  var todayK = today.getFullYear() + '-' + pad2(today.getMonth()+1) + '-' + pad2(today.getDate());
  var box = el('#mBody'); box.innerHTML = '';

  for(var i=0;i<first;i++){
    var p = document.createElement('div'); p.className = 'day pad'; box.appendChild(p);
  }
  for(var d=1; d<=days; d++){
    var k = S.y + '-' + pad2(S.m+1) + '-' + pad2(d);
    var dt = new Date(S.y, S.m, d);
    var cell = document.createElement('div');
    cell.className = 'day';
    var t = T.dayType(dt);
    if(t === 'holiday') cell.classList.add('hol');
    else if(t === 'workday') cell.classList.add('wkd');
    else if(dt.getDay()===0 || dt.getDay()===6) cell.classList.add('off');
    if(k === todayK) cell.classList.add('today');
    var h = '<div class="n">' + d + '</div>';
    list.forEach(function(x){
      var s = T.toDate(x.startAt), e = T.toDate(x.endAt);
      var d0 = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
      var d1 = new Date(d0.getTime() + 86399000);
      if(s <= d1 && e >= d0)
        h += '<div class="pill ' + x.status + '">' + esc(x.name) + '</div>';
    });
    cell.innerHTML = h;
    box.appendChild(cell);
  }

  /* 本月申請清單 */
  list.sort(function(a,b){ return T.toDate(a.startAt) - T.toDate(b.startAt); });
  el('#applCnt').textContent = list.length ? list.length + ' 筆' : '';
  var lb = el('#applList');
  if(!list.length){ lb.innerHTML = '<div class="empty">這個月沒有請假申請。</div>'; return; }
  lb.innerHTML = list.map(function(x){
    var sameDay = T.fmtDate(x.startAt) === T.fmtDate(x.endAt);
    var rng = sameDay
      ? T.fmtDate(x.startAt) + '　' + T.fmtTime(x.startAt) + ' – ' + T.fmtTime(x.endAt)
      : T.fmtDate(x.startAt) + ' – ' + T.fmtDate(x.endAt);
    var h = '<div class="appl"><span class="who">' + esc(x.name) + '</span>' +
      '<span class="rng">' + rng + '</span>';
    if(S.lv2){
      var label = (x.type==='other' && x.otherType) ? x.otherType : T.leaveTypeLabel(x.type);
      h += '<span class="rng" style="color:var(--gold-b)">' + esc(label) + ' ' + x.hours + ' 小時</span>';
    }
    h += '<span class="tag ' + x.status + ' st">' + T.STATUS_LABEL[x.status] + '</span>';
    h += '<div class="tl">申請 ' + T.fmtStamp(x.createdAt);
    if(x.status === 'approved' || x.status === 'rejected')
      h += '　·　' + (x.status==='approved'?'同意':'駁回') + ' ' + T.fmtStamp(x.reviewedAt);
    if(x.status === 'cancelled') h += '　·　已撤銷';
    if(x.status === 'pending') h += '　·　等待秘書長審核';
    h += '</div></div>';
    return h;
  }).join('');
}

/* ---------- 年度總表 ---------- */
function yearOf(x){ return T.toDate(x.startAt || x.date).getFullYear(); }

function renderSummary(){
  var y = parseInt(el('#sumYear').value) || new Date().getFullYear();
  var months = [];
  for(var i=1;i<=12;i++) months.push(y + '-' + pad2(i));

  var people = S.accounts.slice();
  var lvMap = {}, otMap = {};
  people.forEach(function(a){ lvMap[a.email] = {}; otMap[a.email] = {}; });

  S.leaves.forEach(function(x){
    if(x.status !== 'approved') return;
    var m = lvMap[x.email]; if(!m) return;
    var segs = (x.segments && x.segments.length) ? x.segments
             : [{ ym: T.ym(x.startAt), hours: x.hours }];
    segs.forEach(function(sg){
      if(months.indexOf(sg.ym) < 0) return;
      m[sg.ym] = roundHalf((m[sg.ym] || 0) + sg.hours);
    });
  });
  S.ots.forEach(function(x){
    if(x.status !== 'approved') return;
    var m = otMap[x.email]; if(!m) return;
    var k = x.ym || T.ym(x.date);
    if(months.indexOf(k) < 0) return;
    m[k] = roundHalf((m[k] || 0) + x.hours + (x.bonusHours || 0));
  });

  var lvTot = 0, otTot = 0, maxL = 0, maxO = 0;
  people.forEach(function(a){
    months.forEach(function(k){
      lvTot = roundHalf(lvTot + (lvMap[a.email][k] || 0));
      otTot = roundHalf(otTot + (otMap[a.email][k] || 0));
      maxL = Math.max(maxL, lvMap[a.email][k] || 0);
      maxO = Math.max(maxO, otMap[a.email][k] || 0);
    });
  });

  var cntL = S.leaves.filter(function(x){ return yearOf(x)===y; }).length;
  var cntO = S.ots.filter(function(x){ return yearOf(x)===y; }).length;
  el('#sumHero').innerHTML =
    heroCell('請假總時數', lvTot, '小時', y + ' 年已核准') +
    heroCell('加班總時數', otTot, '小時', '含核派加倍') +
    heroCell('請假筆數', cntL, '筆', '含未核准') +
    heroCell('加班筆數', cntO, '筆', '含未核准');

  el('#tLeave').innerHTML = matrix(people, lvMap, months, maxL, '217,169,60');
  el('#tOt').innerHTML    = matrix(people, otMap, months, maxO, '79,190,129');

  /* 長條圖 */
  var perL = months.map(function(k){
    return roundHalf(people.reduce(function(s,a){ return s + (lvMap[a.email][k]||0); }, 0)); });
  var perO = months.map(function(k){
    return roundHalf(people.reduce(function(s,a){ return s + (otMap[a.email][k]||0); }, 0)); });
  var peak = Math.max(1, Math.max.apply(null, perL.concat(perO)));
  el('#bars').innerHTML = months.map(function(k,i){
    return '<div class="barw"><div class="bv">' + (perL[i]||'') + '</div>' +
      '<div class="bb" style="height:' + (perL[i]/peak*100) + '%"></div></div>' +
      '<div class="barw b2"><div class="bv">' + (perO[i]||'') + '</div>' +
      '<div class="bb" style="height:' + (perO[i]/peak*100) + '%"></div></div>';
  }).join('');
  el('#blabels').innerHTML = months.map(function(k){
    return '<div style="flex:2">' + parseInt(k.slice(5)) + '月</div>'; }).join('');
  el('#trendNote').textContent = y + ' 年每月合計，左邊為請假、右邊為加班。';
}
function heroCell(k, v, unit, sub){
  return '<div class="hcell"><div class="k">' + k + '</div>' +
    '<div class="v">' + v + '<small>' + unit + '</small></div>' +
    '<div class="s">' + sub + '</div></div>';
}
function matrix(people, map, months, max, rgb){
  var head = '<thead><tr><th>姓名</th>' +
    months.map(function(k){ return '<th>' + parseInt(k.slice(5)) + '月</th>'; }).join('') +
    '<th class="tot">合計</th></tr></thead>';
  var rows = people.map(function(a){
    var sum = 0;
    var tds = months.map(function(k){
      var v = map[a.email][k] || 0; sum = roundHalf(sum + v);
      if(!v) return '<td>·</td>';
      var alpha = 0.12 + (max ? (v / max) * 0.55 : 0);
      return '<td><span class="cellv" style="background:rgba(' + rgb + ',' + alpha.toFixed(2) +
        ');color:#fff">' + v + '</span></td>';
    }).join('');
    return '<tr><td>' + esc(a.name || a.email) +
      (a.active === false ? ' <span class="termtag">已停用</span>' : '') +
      '</td>' + tds + '<td class="tot">' + sum + '</td></tr>';
  }).join('');
  return head + '<tbody>' + rows + '</tbody>';
}

/* ---------- 明細（可編輯） ---------- */
['#fWho','#fKind','#fStat','#fRange'].forEach(function(i){ el(i).onchange = renderDetail; });

function rangeOf(v){
  var y = new Date().getFullYear(), m = new Date().getMonth();
  if(v === 'm')  return { from:new Date(y,m,1), to:new Date(y,m+1,0,23,59,59) };
  if(v === 'y')  return { from:new Date(y,0,1), to:new Date(y,11,31,23,59,59) };
  if(v === 'ly') return { from:new Date(y-1,0,1), to:new Date(y-1,11,31,23,59,59) };
  return { from:null, to:null };
}

function renderDetail(){
  var r = rangeOf(el('#fRange').value);
  var who = el('#fWho').value, kind = el('#fKind').value, st = el('#fStat').value;
  var list = [];
  if(kind !== 'overtime') list = list.concat(S.leaves.map(function(x){ x.kind='leave'; return x; }));
  if(kind !== 'leave')    list = list.concat(S.ots.map(function(x){ x.kind='overtime'; return x; }));
  list = list.filter(function(x){
    if(who && x.email !== who) return false;
    if(st && x.status !== st) return false;
    var d = T.toDate(x.kind === 'leave' ? x.startAt : x.date);
    if(r.from && d < r.from) return false;
    if(r.to && d > r.to) return false;
    return true;
  }).sort(function(a,b){
    return T.toDate(b.kind==='leave'?b.startAt:b.date) - T.toDate(a.kind==='leave'?a.startAt:a.date);
  });

  el('#detCnt').textContent = list.length + ' 筆';
  var box = el('#detList');
  if(!list.length){ box.innerHTML = '<div class="empty">這個範圍沒有紀錄。</div>'; return; }
  box.innerHTML = '';
  list.forEach(function(x){ box.appendChild(detCard(x)); });
}

function detCard(x){
  var d = document.createElement('div'); d.className = 'rec';
  var isLeave = x.kind === 'leave';
  var label = isLeave
    ? ((x.type==='other' && x.otherType) ? x.otherType : T.leaveTypeLabel(x.type))
    : (x.isDispatch ? '加班（核派）' : '加班');
  var when = isLeave
    ? T.fmtDateTime(x.startAt) + ' → ' + T.fmtDateTime(x.endAt)
    : T.fmtDate(x.date) + '　' + T.fmtTime(x.startAt) + ' – ' + T.fmtTime(x.endAt);

  var h = '<div class="rtop"><span class="nm">' + esc(x.name) + '</span>' +
    (x.term > 1 ? '<span class="termtag">第 ' + x.term + ' 任</span>' : '') +
    '<span class="ty">' + esc(label) + '</span>' +
    '<span class="tag ' + x.status + '">' + T.STATUS_LABEL[x.status] + '</span>' +
    (x.source === 'legacy-import' ? '<span class="imported">舊資料</span>' : '') +
    '<span class="hr">' + x.hours + ' 小時</span></div>' +
    '<div class="rmeta">' + when + '</div>';
  if(isLeave && x.segments && x.segments.length > 1)
    h += '<div class="rmeta">分月：' + x.segments.map(function(s){
      return s.ym + ' ' + s.hours + 'h'; }).join('、') + '</div>';
  if(!isLeave && x.bonusHours > 0)
    h += '<div class="rmeta">核派加倍，實得 ' + roundHalf(x.hours + x.bonusHours) + ' 小時</div>';
  if(x.reason) h += '<div class="rmeta">事由：' + esc(x.reason) + '</div>';
  if(isLeave && x.isLate) h += '<div class="rmeta">事後補請：' + esc(x.lateReason || '未填') + '</div>';

  h += '<div class="rtrail">送出　<b>' + T.fmtStamp(x.createdAt) + '</b>';
  if(x.status==='approved'||x.status==='rejected')
    h += '<br>' + (x.status==='approved'?'同意':'駁回') + '　<b>' + T.fmtStamp(x.reviewedAt) +
         '</b>　' + esc(x.reviewedBy||'');
  if(x.status==='cancelled') h += '<br>已撤銷';
  if(x.adminNote) h += '<br>註記：' + esc(x.adminNote);
  if(x.editedBy) h += '<br>最後修改　<b>' + T.fmtStamp(x.editedAt) + '</b>　' + esc(x.editedBy);
  h += '</div>';
  d.innerHTML = h;

  var btns = document.createElement('div'); btns.className = 'rbtns';
  var eb = document.createElement('button');
  eb.className = 'btn ghost'; eb.textContent = '修改';
  eb.onclick = function(){
    if(d.querySelector('.edit')){ d.querySelector('.edit').remove(); return; }
    d.appendChild(editPanel(x, d));
  };
  var db2 = document.createElement('button');
  db2.className = 'btn no'; db2.textContent = '刪除';
  db2.onclick = function(){
    var msg = '確定刪除這筆紀錄？\n\n' + x.name + '　' + label + '　' + x.hours + ' 小時\n' +
      when + '\n\n';
    msg += x.status === 'approved'
      ? '這筆已核准，刪除後系統會把時數自動還回去。' : '這筆沒有核准，不影響時數。';
    if(!confirm(msg)) return;
    db2.disabled = true; db2.textContent = '刪除中';
    T.deleteRecord(x.kind, x.id).then(function(){
      toast('已刪除','success'); return loadAll();
    }).then(function(){ renderDetail(); })
      .catch(function(e){ toast(e.message,'error'); db2.disabled=false; db2.textContent='刪除'; });
  };
  btns.appendChild(eb); btns.appendChild(db2);
  d.appendChild(btns);
  return d;
}

function toLocal(v){
  var dt = T.toDate(v);
  if(isNaN(dt)) return '';
  return dt.getFullYear() + '-' + pad2(dt.getMonth()+1) + '-' + pad2(dt.getDate()) +
    'T' + pad2(dt.getHours()) + ':' + pad2(dt.getMinutes());
}

function editPanel(x, host){
  var w = document.createElement('div'); w.className = 'edit';
  var isLeave = x.kind === 'leave';
  var h = '<div class="egrid">';
  if(isLeave){
    h += '<div><label>假別</label><select class="e-type">' +
      T.LEAVE_TYPES.map(function(t){
        return '<option value="' + t.id + '"' + (t.id===x.type?' selected':'') + '>' + t.label + '</option>';
      }).join('') + '</select></div>';
    h += '<div><label>狀態</label><select class="e-st">' +
      ['pending','approved','rejected','cancelled'].map(function(s){
        return '<option value="' + s + '"' + (s===x.status?' selected':'') + '>' +
          T.STATUS_LABEL[s] + '</option>'; }).join('') + '</select></div>';
    h += '<div><label>開始</label><input type="datetime-local" class="e-s" value="' + toLocal(x.startAt) + '"></div>';
    h += '<div><label>結束</label><input type="datetime-local" class="e-e" value="' + toLocal(x.endAt) + '"></div>';
    h += '<div><label>時數</label><input type="number" step="0.5" class="e-h" value="' + x.hours + '"></div>';
    h += '<div><label>註記</label><input type="text" class="e-n" value="' + esc(x.adminNote||'') + '"></div>';
  } else {
    h += '<div><label>日期</label><input type="date" class="e-d" value="' + toLocal(x.date).slice(0,10) + '"></div>';
    h += '<div><label>狀態</label><select class="e-st">' +
      ['pending','approved','rejected','cancelled'].map(function(s){
        return '<option value="' + s + '"' + (s===x.status?' selected':'') + '>' +
          T.STATUS_LABEL[s] + '</option>'; }).join('') + '</select></div>';
    h += '<div><label>開始</label><input type="datetime-local" class="e-s" value="' + toLocal(x.startAt) + '"></div>';
    h += '<div><label>結束</label><input type="datetime-local" class="e-e" value="' + toLocal(x.endAt) + '"></div>';
    h += '<div><label>時數</label><input type="number" step="0.5" class="e-h" value="' + x.hours + '"></div>';
    h += '<div><label>核派加班（補休加倍）</label><select class="e-dp">' +
      '<option value="0"' + (!x.isDispatch?' selected':'') + '>否</option>' +
      '<option value="1"' + (x.isDispatch?' selected':'') + '>是</option></select></div>';
    h += '<div style="grid-column:1/-1"><label>事由</label><input type="text" class="e-r" value="' +
      esc(x.reason||'') + '"></div>';
  }
  h += '</div>';
  w.innerHTML = h;

  var foot = document.createElement('div'); foot.className = 'efoot';
  var save = document.createElement('button'); save.className='btn'; save.textContent='儲存';
  var cancel = document.createElement('button'); cancel.className='btn ghost'; cancel.textContent='取消';
  cancel.onclick = function(){ w.remove(); };
  save.onclick = function(){
    var patch = {};
    var q = function(c){ return w.querySelector(c); };
    patch.status = q('.e-st').value;
    patch.hours = parseFloat(q('.e-h').value);
    if(isNaN(patch.hours)) return toast('時數要填數字','error');
    if(isLeave){
      patch.type = q('.e-type').value;
      patch.startAt = new Date(q('.e-s').value);
      patch.endAt   = new Date(q('.e-e').value);
      patch.adminNote = q('.e-n').value;
      if(isNaN(patch.startAt) || isNaN(patch.endAt)) return toast('日期時間格式不對','error');
    } else {
      patch.date = new Date(q('.e-d').value + 'T00:00:00');
      patch.startAt = new Date(q('.e-s').value);
      patch.endAt   = new Date(q('.e-e').value);
      patch.isDispatch = q('.e-dp').value === '1';
      patch.reason = q('.e-r').value;
      if(isNaN(patch.date)) return toast('日期格式不對','error');
    }
    save.disabled = true; save.textContent = '儲存中…';
    T.editRecord(x.kind, x.id, patch).then(function(){
      toast('已更新','success'); return loadAll();
    }).then(function(){ renderDetail(); })
      .catch(function(e){
        toast(e.message,'error'); save.disabled=false; save.textContent='儲存';
      });
  };
  foot.appendChild(save); foot.appendChild(cancel);
  w.appendChild(foot);
  return w;
}

</script>
</body>
</html>
