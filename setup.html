<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D14">
<title>初始建置 — 請假加班系統</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0D14;--card:#151C2B;--gold:#D9A93C;--gold-b:#F5D583;--txt:#EAEDF4;
  --dim:#8D96AC;--dim2:#5C6478;--ok:#4FBE81;--bad:#E0605A;--line:rgba(217,169,60,.18);
  --mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--txt);
  padding:calc(28px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
  line-height:1.65;font-size:15px}
.w{max-width:560px;margin:0 auto}
h1{font-size:22px;margin-bottom:6px}
.sub{color:var(--dim);font-size:13.5px;margin-bottom:22px}
.card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:14px;
  box-shadow:0 0 0 1px var(--line)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:right;padding:8px 6px;color:var(--dim);font-weight:500;font-size:11px;
  border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:9px 6px;border-bottom:1px solid rgba(255,255,255,.05);text-align:right;
  font-family:var(--mono);color:var(--gold-b)}
td:first-child{font-family:'Noto Sans TC';color:var(--txt);font-weight:600}
.em{font-family:var(--mono);font-size:10.5px;color:var(--dim2);display:block;font-weight:400}
button{width:100%;background:linear-gradient(145deg,var(--gold-b),var(--gold));color:#1C1305;
  border:none;border-radius:11px;padding:14px;font-weight:700;font-size:15px;cursor:pointer;
  font-family:inherit}
button:disabled{background:#2B3243;color:var(--dim2)}
#log{font-family:var(--mono);font-size:12px;line-height:1.9;margin-top:16px;white-space:pre-wrap}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.warn{background:rgba(229,168,63,.08);color:var(--gold-b);padding:12px 14px;border-radius:10px;
  font-size:13px;margin-bottom:16px;box-shadow:0 0 0 1px var(--line)}
</style>
</head>
<body><div class="w">
<h1>初始建置</h1>
<p class="sub">把四位秘書的資料一次寫進系統，不用手動輸入。</p>

<div class="warn">這支只需要跑一次。跑完就可以把 setup.html 從 GitHub 刪掉。<br>
重複執行會把時數覆蓋回下面這張表的數字。</div>

<div class="card">
<table>
<thead><tr><th>姓名</th><th>到職日</th><th>遞延特休</th><th>今年特休</th><th>補休</th></tr></thead>
<tbody id="preview"></tbody>
</table>
</div>

<div class="card">
<button id="go">開始建置</button>
<div id="log"></div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
<script>
var T = window.TPS;
/* 資料來源：社團法人台灣物理學會行政室請假加班時數_20240301（2026/8/13 版）
   遞延特休 = 2025未結 − 2026已使用（遞延優先扣） */
var SEED = [
  { email:'office@ps-taiwan.org',    name:'楊雅婷', hire:'2024-03-01',
    carry:19.5, current:70,   comp:119,   usedA:29.5, usedC:206 },
  { email:'conf@ps-taiwan.org',      name:'簡鑫如', hire:'2024-03-01',
    carry:3,    current:70,   comp:151.5, usedA:44,   usedC:112 },
  { email:'cjp@ps-taiwan.org',       name:'楊綺萍', hire:'2023-12-01',
    carry:63,   current:0,    comp:25.5,  usedA:7,    usedC:107 },
  { email:'bimonthly@ps-taiwan.org', name:'張文樺', hire:'2026-06-01',
    carry:0,    current:0,    comp:6.5,   usedA:0,    usedC:41 },
  { email:'chenfdhs453@gmail.com',   name:'陳睿騏', hire:'2025-01-01',
    carry:20,   current:21,   comp:0,     usedA:0,    usedC:0 }
];
var EXPIRE = '2026-12-31';

document.getElementById('preview').innerHTML = SEED.map(function(s){
  return '<tr><td>' + s.name + '<span class="em">' + s.email + '</span></td>' +
    '<td>' + s.hire + '</td><td>' + s.carry + '</td><td>' + s.current + '</td>' +
    '<td>' + s.comp + '</td></tr>';
}).join('');

var logEl = document.getElementById('log');
function say(msg, cls){
  logEl.innerHTML += '<span class="' + (cls||'') + '">' + msg + '</span>\n';
}

document.getElementById('go').onclick = function(){
  var b = document.getElementById('go');
  b.disabled = true; b.textContent = '建置中…'; logEl.innerHTML = '';
  T.adminLogin(T.ADMIN_PASSWORD);
  var expire = T.Timestamp.fromDate(new Date(EXPIRE + 'T23:59:59'));

  SEED.reduce(function(chain, s){
    return chain.then(function(){
      return T.upsertAccount(s.email, {
        name: s.name, term: 1, active: true,
        hireDate: T.Timestamp.fromDate(new Date(s.hire + 'T00:00:00')),
        resignDate: null, pwHash: T._hashPw(T.DEFAULT_PW),
        createdAt: T.serverTimestamp()
      }).then(function(){
        return T.setMerge(T.COL.balances, s.email, {
          annualCarry: s.carry,
          annualCarryExpire: s.carry > 0 ? expire : null,
          annualCurrent: s.current,
          annualRemaining: T.roundHalf(s.carry + s.current),
          compRemaining: s.comp,
          annualUsedYTD: s.usedA, compUsedYTD: s.usedC, compEarnedYTD: 0,
          expiredCarryHours: 0, updatedAt: T.serverTimestamp()
        });
      }).then(function(){
        say('✔ ' + s.name + '　' + s.email + '　特休 ' +
            T.roundHalf(s.carry + s.current) + '　補休 ' + s.comp, 'ok');
      });
    });
  }, Promise.resolve())
  .then(function(){
    say('');
    say('建置完成，' + SEED.length + ' 個信箱都建好了。', 'ok');
    say('預設密碼：' + T.DEFAULT_PW);
    say('後台密碼：' + T.ADMIN_PASSWORD);
    b.textContent = '完成';
  })
  .catch(function(e){
    say('✘ 失敗：' + (e.message || e), 'bad');
    b.disabled = false; b.textContent = '重試';
  });
};
</script>
</body>
</html>
